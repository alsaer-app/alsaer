/* ---------- ٢) ختمة القرآن ---------- */
function khGet(){var K=S.khatma;return K&&typeof K==='object'&&K.start&&K.days?K:null}
function khStats(K){
  var read=0;Object.keys(S.quran.log||{}).forEach(function(d){if(d>=K.start)read+=S.quran.log[d]||0});
  var per=Math.ceil(604/K.days),el=Math.max(0,f5diff(K.start,dk())),exp=Math.min(604,el*per),today=(S.quran.log||{})[dk()]||0;
  return {read:Math.min(604,read),per:per,el:el,exp:exp,today:today,left:Math.max(0,604-read),dleft:Math.max(0,K.days-el)};
}
function vKhatma(){
  var K=khGet(),chips=[15,20,30,45,60,90].map(function(n){return '<button class="chip'+(K&&K.days===n?' on':'')+'" data-a="khset" data-v="'+n+'">'+ar(n)+' يومًا</button>'}).join('');
  if(!K)return '<section class="card"><h3>ختمة القرآن</h3><p class="note">اختر المدة التي تريد أن تختم فيها القرآن، وسيحسب التطبيق وردك اليومي ويخبرك إن كنت متقدّمًا أو متأخرًا.</p><div class="chips">'+chips+'</div></section>';
  var s=khStats(K),diff=s.read-s.exp,pct=Math.round(s.read/604*100),st=s.read>=604?'أتممتَ الختمة — تقبّل الله منك 🌙':(diff>=0?'أنت متقدّم بـ '+ar(diff)+' صفحة — بارك الله فيك':'أنت متأخر بـ '+ar(-diff)+' صفحة — تعوّضها بإذن الله');
  return '<div class="kh"><section class="rm5-hero"><small>ختمتك خلال '+ar(K.days)+' يومًا</small><b>'+ar(pct)+'٪</b><span>'+ar(s.read)+' من ٦٠٤ صفحة</span><div class="bar"><div style="width:'+pct+'%"></div></div></section>'
   +'<section class="card"><div class="kh-g"><div><small>ورد اليوم</small><b>'+ar(s.per)+'</b><em>صفحة</em></div><div><small>قرأتَ اليوم</small><b>'+ar(s.today)+'</b><em>'+(s.today>=s.per?'✓ تمّ الورد':'متبقٍّ '+ar(s.per-s.today))+'</em></div><div><small>الأيام الباقية</small><b>'+ar(s.dleft)+'</b><em>يومًا</em></div></div>'
   +'<p class="note kh-st">'+st+'</p>'
   +(S.quran.goal!==Math.min(30,s.per)?'<button class="btn" data-a="khgoal">اجعل وردي اليومي '+ar(Math.min(30,s.per))+' صفحة</button>':'')+'</section>'
   +'<section class="card"><h3>تغيير المدة</h3><div class="chips">'+chips+'</div><div class="acts"><button class="btn ghost bad" data-a="khreset">إلغاء الختمة</button></div></section></div>';
}

var ZK_F=[['cash','النقد والأرصدة (بالعملة)'],['goldg','الذهب (جرام)'],['silverg','الفضة (جرام)'],['trade','عروض التجارة (قيمتها)'],['debt','ديون مستحقّة عليك (تُخصم)']];
function zkGet(){var z=S.zk;if(!z||typeof z!=='object'||Array.isArray(z))z=S.zk={};return z}
function zkCalc(){
  var z=zkGet(),gp=f5n(z.goldp),sp=f5n(z.silverp),base=z.nisab==='silver'?'silver':'gold';
  var gold=f5n(z.goldg)*gp,silver=f5n(z.silverg)*sp,total=Math.max(0,f5n(z.cash)+gold+silver+f5n(z.trade)-f5n(z.debt));
  var nis=base==='gold'?85*gp:595*sp,ok=nis>0&&total>=nis;
  return {total:total,nis:nis,ok:ok,zakat:ok?total*0.025:0,base:base,need:nis<=0};
}
function zkResult(){

function ffSlots(c){

  return out.sort(function(a,b){return a-b});

function ffUpcomingJs(c,n){
  var sl=ffSlots(c),out=[],t=Date.now();if(!sl.length)return out;
  for(var k=0;k<n;k++){
    var found=0;
    for(var d=0;d<9&&!found;d++){

      if(c.days&&c.days.length&&c.days.indexOf(day.getDay())<0)continue;

    }

  }

}

    {n:'القابض', m:'يقبض الأرزاق والأرواح بحكمته', e:'يقبض الرزق عمن يشاء ابتلاءً أو حكمة، ويقبض الأرواح عند انتهاء آجالها.', i:'عند ضيق الرزق قل: يا قابض ابسط رزقي فأنت الرزاق.'},
    {n:'الباسط', m:'يبسط الرزق والأرزاق لمن يشاء', e:'يوسّع الرزق على من يشاء توسعة، ويبسط الأرض والأرزاق فضلًا منه ورحمة.', i:'عند طلب السعة قل: يا باسط ابسط لي في رزقي ووقتي.'},
    {n:'الخافض', m:'يخفض الجبابرة والمتكبرين بعدله', e:'يذل من يشاء ويضع من تكبر واستعلى، فلا عزة إلا بطاعته.', i:'عند الظلم قل: يا خافض اخفض من ظلمني.'},
    {n:'الرافع', m:'يرفع أولياءه ودرجات الصالحين', e:'يرفع من شاء بالإيمان والعمل الصالح، ويرفع الدرجات في الدنيا والآخرة.', i:'عند طلب الرفعة قل: يا رافع ارفع درجتي عندك.'},
    {n:'المعز', m:'يهب العزة لمن يشاء من خلقه', e:'يعطي العزة لمن أطاعه، فالعزة كلها بيده يمنحها من يشاء.', i:'عند طلب العزة قل: يا معز أعزّني بطاعتك ورضاك.'},
    {n:'المذل', m:'يذل من يشاء بعدله وحكمته', e:'يذل من عصاه واستكبر عليه، فلا يملك أحد عزًا إلا بإذنه.', i:'استعذ من الذل: أعوذ بك يا معز من أن تذلني.'},
    {n:'السميع', m:'يسمع كل صوت خفيًا كان أو جهيرًا', e:'يسمع كل الأصوات مهما خفتت أو تعددت في وقت واحد، لا يخفى عليه صوت.', i:'عند الدعاء تيقّن: يا سميع أنت تسمع دعائي وحديث نفسي.'},
    {n:'البصير', m:'يرى كل شيء دقيقه وجليله', e:'يبصر كل ما في الكون ظاهرًا وخفيًا، لا يغيب عن بصره شيء مهما صغر.', i:'عند العمل الصالح استشعر: يا بصير أنت ترى اجتهادي.'},
    {n:'الحكم', m:'الفيصل الذي يحكم بين خلقه بالحق', e:'حكمه نافذ لا رادّ له، يفصل بين الناس يوم القيامة بالعدل التام.', i:'عند الخصومة قل: يا حكم احكم لي بالحق.'},
    {n:'العدل', m:'المنزّه عن الظلم في كل حكمه', e:'لا يظلم أحدًا مثقال ذرة، وأحكامه كلها موزونة بالعدل الكامل.', i:'عند الظلم تذكّر: يا عدل لن يضيع عندك حقي.'},
    {n:'اللطيف', m:'الرفيق بعباده العليم بدقائق أمورهم', e:'يوصل الخير لعباده برفق من حيث لا يحتسبون، ويعلم دقائق أحوالهم.', i:'عند الحاجة قل: يا لطيف الطف بي فيما قدّرته لي.'},
    {n:'الخبير', m:'العليم ببواطن الأمور وحقائقها', e:'يعلم دقائق الأمور وخفاياها كما يعلم ظاهرها، لا يخفى عليه شيء من الحقائق.', i:'عند التخطيط قل: يا خبير أنت أعلم بعاقبة أمري.'},
    {n:'الحليم', m:'لا يعاجل العصاة بالعقوبة', e:'يمهل من عصاه ولا يعجل بالعقوبة رغم قدرته، رجاء أن يتوب العبد ويرجع.', i:'عند الغضب تذكّر حلمه: يا حليم أمهلني كما أمهلتني كثيرًا.'},
    {n:'العظيم', m:'الموصوف بكل صفات العظمة والجلال', e:'عظمته لا يحيط بها وصف، أكبر من كل شيء وأجل من كل تصور.', i:'عند التسبيح قل: سبحان الله العظيم وبحمده.'},
    {n:'الغفور', m:'شديد المغفرة الساتر للذنوب', e:'يغفر الذنوب جميعًا مهما كثرت وعظمت، لمن تاب إليه توبة صادقة.', i:'أكثر من الاستغفار: رب اغفر لي إنك أنت الغفور الرحيم.'},
    {n:'الشكور', m:'يجازي على القليل من الطاعة بالكثير من الأجر', e:'يقبل العمل القليل ويضاعف عليه الأجر الكثير، ويشكر عباده على طاعتهم.', i:'عند العمل الصالح قل: يا شكور تقبّل مني هذا القليل.'},
    {n:'العلي', m:'الرفيع فوق خلقه بذاته وقدره', e:'علوّه علو الذات والقدر والشأن، فوق كل شيء لا يعلو عليه أحد.', i:'عند التذلل قل: يا علي أنت الأعلى وأنا الفقير إليك.'},
    {n:'الكبير', m:'الأعظم من كل شيء قدرًا وشأنًا', e:'أكبر من كل كبير، وكل عظمة في الكون دونه، لا يقاس به شيء.', i:'كبّر عند كل أمر: الله أكبر من كل شيء.'},
    {n:'الحفيظ', m:'الحافظ لعباده وأعمالهم من الضياع', e:'يحفظ عباده من المهالك، ويحفظ أعمالهم كاملة ليجازيهم عليها يوم القيامة.', i:'عند السفر قل: يا حفيظ احفظني في نفسي وأهلي ومالي.'},
    {n:'المقيت', m:'المقتدر الذي يعطي الأقوات لكل حي', e:'يوصل القوت لكل مخلوق بقدرته، ويقتدر على إيصال كل ما يحتاجه العبد.', i:'عند الحاجة قل: يا مقيت أوصل لي رزقي وقوتي.'},
    {n:'الحسيب', m:'الكافي عباده والمحاسب لهم على أعمالهم', e:'يكفي من توكل عليه، ويحاسب الخلق على أدق أعمالهم يوم القيامة.', i:'عند التوكل قل: حسبنا الله ونعم الوكيل.'},
    {n:'الجليل', m:'الموصوف بصفات الجلال والعظمة الكاملة', e:'له الجلال المطلق في ذاته وصفاته، تتضاءل أمامه كل معاني العظمة البشرية.', i:'عند التسبيح قل: يا ذا الجلال والإكرام أكرمني بطاعتك.'},
    {n:'الكريم', m:'كثير العطاء والفضل بلا حساب', e:'يعطي من سأله ومن لم يسأله، كرمه لا ينفد ولا تحده حدود.', i:'عند السؤال قل: يا كريم أكرمني من فضلك الواسع.'},
    {n:'الرقيب', m:'المطّلع الحافظ لكل شيء لا يغفل', e:'يراقب أعمال عباده وأحوالهم في كل لحظة، لا يغفل عنهم طرفة عين.', i:'استشعر رقابته عند الخلوة: يا رقيب أنت شاهد عليّ في السر والعلن.'},
    {n:'المجيب', m:'يجيب دعاء الداعي إذا دعاه', e:'يستجيب لمن دعاه بصدق وإخلاص، ولو تأخرت الإجابة فهي محققة بحكمته.', i:'عند الدعاء قل: يا مجيب استجب لي فأنت أكرم مسؤول.'},
    {n:'الواسع', m:'واسع الرحمة والعلم والفضل والرزق', e:'رحمته وعلمه وفضله لا حدود لها، يسع كل شيء برحمته وعطائه.', i:'عند الضيق قل: يا واسع وسّع عليّ من فضلك.'},
    {n:'الحكيم', m:'المحكم لكل شيء يضعه في موضعه', e:'يضع كل شيء في موضعه الصحيح بحكمة بالغة، لا عبث في خلقه ولا تدبيره.', i:'عند التسليم بالقدر قل: يا حكيم أنت أعلم بحكمة ما قدّرت.'},
    {n:'الودود', m:'المحب لأوليائه المحبوب من عباده الصالحين', e:'يحب عباده الصالحين ويحبونه، وهو الذي يجعل المحبة بين قلوب المؤمنين.', i:'عند طلب المحبة قل: يا ودود اجعلني محبًا لك محبوبًا عندك.'},
    {n:'المجيد', m:'العظيم الكريم الواسع الفضل والمجد', e:'له المجد الكامل في ذاته وصفاته وأفعاله، عظيم الشأن كريم العطاء.', i:'عند الثناء عليه قل: سبحان ربي العظيم المجيد.'},
    {n:'الباعث', m:'يبعث الخلق يوم القيامة للحساب', e:'يبعث الموتى من قبورهم يوم القيامة للحساب والجزاء، ويبعث الرسل بالهدى.', i:'تذكّر البعث لتحسين العمل: يا باعث أعدّني ليوم يُبعث فيه الناس.'},
    {n:'الشهيد', m:'الحاضر المطّلع على كل شيء لا يغيب عنه', e:'شاهد على كل قول وفعل، حاضر بعلمه في كل مكان وزمان.', i:'عند الأمانة تذكّر: يا شهيد أنت شاهد على ما أقول وأفعل.'},
    {n:'الحق', m:'الثابت وجوده حقًا لا شك فيه', e:'وجوده حق ثابت لا يتغير، ووعده حق، ودينه حق لا باطل فيه.', i:'عند الشك قل: يا حق ثبّتني على الحق حتى ألقاك.'},
    {n:'الوكيل', m:'الكافي لمن توكل عليه وفوّض أمره إليه', e:'يكفي أمر من توكل عليه واعتمد عليه في شؤونه كلها.', i:'عند الشدائد قل: حسبي الله ونعم الوكيل.'},
    {n:'القوي', m:'كامل القدرة لا يعجزه شيء', e:'قوته كاملة لا يعتريها ضعف ولا نقص، لا يعجزه شيء في السماوات ولا الأرض.', i:'عند الضعف قل: يا قوي قوّني على طاعتك.'},
    {n:'المتين', m:'الشديد القوة الثابت الذي لا يتزعزع', e:'قوته وقدرته ثابتة راسخة لا تتزعزع أمام شيء، فوق كل قوة تصورها.', i:'عند التعب قل: يا متين أعنّي وثبّت قلبي.'},
    {n:'الولي', m:'ناصر أوليائه ومتولي أمورهم برعايته', e:'يتولى أمور عباده المؤمنين، ينصرهم ويحفظهم ويدبر شؤونهم برعاية خاصة.', i:'عند الحاجة للنصرة قل: يا ولي تولَّ أمري كله.'},
    {n:'الحميد', m:'المستحق للحمد كله على كل حال', e:'يستحق الحمد الكامل على كل نعمة وكل قضاء، حمده واجب في كل حال.', i:'قل دومًا: الحمد لله على كل حال.'},
    {n:'المحصي', m:'المحيط علمه بعدد كل شيء ودقائقه', e:'يحصي أعمال العباد وأنفاسهم وكل شيء في الوجود بدقة تامة لا يند عنها شيء.', i:'تذكّر عند العمل: يا محصي أحصيت عملي فأحسن حسابي.'},
    {n:'المبدئ', m:'الذي أبدأ الخلق من غير مثال سابق', e:'أوجد الخلق أول مرة من العدم دون أن يسبقه مثال يحتذيه.', i:'تفكّر في بدء الخلق: يا مبدئ كما أبدأتني أحسن ختامي.'},
    {n:'المعيد', m:'يعيد الخلق بعد الموت للبعث والحساب', e:'يعيد الخلق مرة أخرى بعد فنائه، كما أبدأه أول مرة، ليحاسبهم على أعمالهم.', i:'تذكّر الإعادة: يا معيد أعدني إلى رحمتك يوم القيامة.'},
    {n:'المحيي', m:'واهب الحياة لكل حي', e:'يحيي الأجساد بعد الموت، ويحيي القلوب بالإيمان، وهو مصدر كل حياة.', i:'عند إحياء الأرض بالمطر تذكّر: يا محيي أحيِ قلبي بذكرك.'},
    {n:'المميت', m:'مقدّر الموت على كل حي', e:'يميت من يشاء في الوقت الذي قدّره، لا يتقدم أجل ولا يتأخر عن وقته.', i:'تذكّر الموت للاستعداد: يا مميت أحسن ختامي عند الموت.'},
    {n:'الحي', m:'صاحب الحياة الكاملة الدائمة التي لا تزول', e:'حياته أزلية أبدية لا يعتريها فناء ولا نوم ولا تعب، حياة كاملة تامة.', i:'عند التوكل قل: توكلت على الحي الذي لا يموت.'},
    {n:'القيوم', m:'القائم بتدبير كل شيء وحفظه', e:'قائم بنفسه، ومقيم لكل المخلوقات، يدبر أمورها ويحفظها من الزوال.', i:'اقرأ آية الكرسي وتوكل: يا حي يا قيوم برحمتك أستغيث.'},
    {n:'الواجد', m:'الغني الذي لا يفتقر لشيء ويجد كل ما يريد', e:'لا يعوزه شيء، يجد كل ما يريده متى شاء، غني بذاته عن كل أحد.', i:'عند الافتقار قل: يا واجد أغنني من فضلك.'},
    {n:'الماجد', m:'العظيم الكريم الواسع الجود والفضل', e:'مجده عظيم في ذاته وأفعاله، كريم واسع الفضل والإحسان على عباده.', i:'عند الثناء قل: يا ماجد لك المجد كله في السماوات والأرض.'},
    {n:'الواحد', m:'المتفرد بذاته وصفاته لا شريك له', e:'واحد في ذاته وأفعاله وصفاته، لا يشاركه أحد في شيء من خصائصه.', i:'وحّده في العبادة: لا إله إلا أنت وحدك لا شريك لك.'},
    {n:'الأحد', m:'المتفرد الذي لا ثاني له مطلقًا', e:'أحدية كاملة لا تقبل التجزئة أو الشراكة أو المثيل، هو وحده الأحد الفرد.', i:'اقرأ سورة الإخلاص متدبرًا: قل هو الله أحد.'},
    {n:'الصمد', m:'الذي يُقصد في الحوائج ولا يحتاج لأحد', e:'تُقصد إليه الخلائق كلها في حاجاتها، وهو غني عنها لا يحتاج إلى شيء منها.', i:'عند الحاجة توجّه إليه وحده: يا صمد إليك وحدك المشتكى.'},
    {n:'القادر', m:'صاحب القدرة الكاملة على كل شيء', e:'قادر على كل ممكن، لا يعجزه شيء في الكون صغيرًا كان أو كبيرًا.', i:'عند الشعور بالعجز قل: يا قادر أنت قادر على قضاء حاجتي.'},
    {n:'المقتدر', m:'كامل القدرة الذي يقهر بقدرته كل شيء', e:'قدرته أشمل من مطلق القدرة، فهو المقتدر الذي لا يحده شيء في تنفيذ إرادته.', i:'عند الشدة قل: يا مقتدر يسّر لي أمري الصعب.'},
    {n:'المقدم', m:'يقدّم من يشاء بفضله وحكمته', e:'يقدّم من يشاء في الرتبة والمنزلة والزمان بحكمته البالغة.', i:'عند طلب التوفيق قل: يا مقدم قدّمني في الخير.'},
    {n:'المؤخر', m:'يؤخر من يشاء بحكمته وعدله', e:'يؤخر من يشاء عن منزلته أو أجله بحكمة يعلمها، لا اعتراض على قضائه.', i:'عند التسليم بالتأخير قل: يا مؤخر لك الحكمة فيما أخّرت.'},
    {n:'الأول', m:'الذي ليس قبله شيء', e:'أزلي لا بداية لوجوده، كان قبل كل شيء ولم يكن معه شيء آخر.', i:'تدبر أزليته: يا أول ليس قبلك شيء وأنت خالق كل شيء.'},
    {n:'الآخر', m:'الذي ليس بعده شيء', e:'باقٍ بعد فناء كل شيء، لا نهاية لوجوده، هو الآخر بعد فناء الخلق جميعًا.', i:'تذكّر بقاءه عند فناء الدنيا: يا آخر أنت الباقي بعد فناء كل شيء.'},
    {n:'الظاهر', m:'الغالب فوق كل شيء الظاهر بآياته وأدلته', e:'ظاهر بأدلة وجوده وآياته الواضحة في كل شيء، فوق كل شيء بقدرته وعلوه.', i:'تأمل في آياته الظاهرة: يا ظاهر أظهرت لي الحق فثبّتني عليه.'},
    {n:'الباطن', m:'العليم بما بطن وخفي من الأمور', e:'مطّلع على بواطن الأمور وخفاياها، لا تخفى عليه سريرة ولا خاطر يمر بالقلب.', i:'استشعر علمه بالسرائر: يا باطن اطّلعت على سري فطهّره.'},
    {n:'الوالي', m:'المتولي لتدبير الكون كله بنفسه', e:'يتولى تدبير أمر الكون كله بنفسه، مالك أمر كل شيء ومدبره وحده.', i:'عند التفويض قل: يا والي تولَّ أمري في الدنيا والآخرة.'},
    {n:'المتعالي', m:'المنزّه عن كل نقص وشبيه', e:'متعالٍ عن كل ما لا يليق به من مثيل أو نقص أو عجز، فوق كل تصور.', i:'نزّهه عند الشرك: يا متعالي تعاليت عما يصفه المشركون.'},
    {n:'البر', m:'المحسن إلى خلقه بلطفه وعطائه', e:'كثير الإحسان والبر بعباده، يتلطف بهم ويحسن إليهم في كل أحوالهم.', i:'عند سؤال البر قل: يا بر ارزقني برًا بوالديّ وبك.'},
    {n:'التواب', m:'يقبل توبة عباده مهما تكررت الذنوب', e:'يفتح باب التوبة دومًا ويقبلها من عبده مهما عاد للذنب، رحمة منه وفضلًا.', i:'أكثر من التوبة: يا تواب تب عليّ فإني تائب إليك.'},
    {n:'المنتقم', m:'ينتقم من الظالمين المصرّين على الكفر والظلم', e:'ينتقم ممن أصرّ على الظلم والفساد بعد الإمهال، عدلًا منه لا ظلمًا.', i:'عند الظلم قل: يا منتقم انتقم لي ممن ظلمني بحقك لا بحقي.'},
    {n:'العفو', m:'يمحو الذنوب ويتجاوز عنها بلا حساب', e:'يمحو السيئات محوًا تامًا ويتجاوز عن المذنب كأن الذنب لم يكن.', i:'كان النبي ﷺ يعلّم: اللهم إنك عفو تحب العفو فاعف عني.'},
    {n:'الرؤوف', m:'شديد الرأفة واللطف بعباده', e:'رأفته بعباده تفوق رأفة الوالدة بولدها، يرفق بهم في كل تدبيره لشؤونهم.', i:'عند الضعف قل: يا رؤوف ارأف بضعفي وقلة حيلتي.'},
    {n:'مالك الملك', m:'المتصرف في الملك كله يعطيه ويسلبه', e:'يعطي الملك من يشاء وينزعه ممن يشاء، لا يسأله أحد عما يفعل في ملكه.', i:'عند طلب التمكين قل: يا مالك الملك آتني ملكًا من عندك.'},

/* ===== أسماء الله الحسنى: حفظ ومسبحة واختبار ===== */
var ASM=ASM_RAW.map(function(x,i){return {id:'n'+(i+1),o:i+1,n:x.n,m:x.m,e:x.e,i:x.i}});
var asmS={tab:'grid',q:'',cur:null,idx:0,qz:null,ok:0,bad:0};
function asmP(){var P=S.asma;if(!P||typeof P!=='object')P=S.asma={learned:{}};if(!P.learned)P.learned={};return P}
function asmCount(){var L=asmP().learned,c=0;ASM.forEach(function(x){if(L[x.id])c++});return c}
function asmEsc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function asmGridHtml(){
  var q=asmS.q.trim(),L=asmP().learned,l=ASM.filter(function(x){return !q||x.n.indexOf(q)>-1||x.m.indexOf(q)>-1});
  if(!l.length)return '<p class="asm-empty">لا يوجد اسم مطابق لبحثك.</p>';
  return '<div class="asm-grid">'+l.map(function(x){return '<button class="asm-card" data-a="asmopen" data-v="'+x.id+'"><i class="asm-dot'+(L[x.id]?' on':'')+'"></i><small>'+ar(x.o)+'</small><b>'+x.n+'</b><span>'+asmEsc(x.m)+'</span></button>'}).join('')+'</div>';
}
function asmQuizNew(){
  var ci=Math.floor(Math.random()*ASM.length),c=ASM[ci],ask=Math.random()>.5,pool=ASM.filter(function(x,i){return i!==ci}).sort(function(){return Math.random()-.5}).slice(0,3);
  asmS.qz={c:c.id,ask:ask,opts:[c].concat(pool).sort(function(){return Math.random()-.5}).map(function(x){return x.id}),ans:null};
}
function vAsma(){
  var P=asmP(),h='<div class="asm">';
  if(asmS.cur){
    var x=ASM.filter(function(y){return y.id===asmS.cur})[0],i=x.o-1,done=!!P.learned[x.id];
    return h+'<div class="asm-crumb"><button class="btn ghost" data-a="asmback">← الأسماء</button></div>'
      +'<section class="card asm-head"><small>الاسم رقم '+ar(x.o)+' من ٩٩</small><h2>'+x.n+'</h2><p>'+asmEsc(x.m)+'</p>'
      +'<div class="acts"><button class="btn'+(done?'':' ghost')+'" data-a="asmmark" data-v="'+x.id+'">'+(done?'★ مُعلَّمة كمحفوظة':'☆ وضع علامة «حفظتها»')+'</button><button class="btn ghost" data-a="asmshare" data-v="'+x.id+'">مشاركة</button></div></section>'
      +'<section class="card"><h3>شرح الاسم</h3><p class="asm-txt">'+asmEsc(x.e)+'</p></section>'
      +'<section class="card asm-inv"><h3>كيف تدعو الله به</h3><p class="asm-txt">'+asmEsc(x.i)+'</p></section>'
      +'<div class="acts"><button class="btn ghost" data-a="asmopen" data-v="'+(i>0?ASM[i-1].id:x.id)+'"'+(i<1?' disabled':'')+'>→ السابق</button><button class="btn ghost" data-a="asmopen" data-v="'+(i<ASM.length-1?ASM[i+1].id:x.id)+'"'+(i>=ASM.length-1?' disabled':'')+'>التالي ←</button></div></div>';
  }
  var c=asmCount();
  h+='<section class="card asm-prog"><div><b>تقدّمك في الحفظ</b><span>'+ar(c)+' من ٩٩</span></div><div class="asm-bar"><i style="width:'+Math.round(c/ASM.length*100)+'%"></i></div></section>'
   +'<div class="asm-tabs">'+[['grid','الأسماء'],['tasbih','المسبحة'],['quiz','اختبار']].map(function(t){return '<button class="'+(asmS.tab===t[0]?'on':'')+'" data-a="asmtab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
  if(asmS.tab==='grid')h+='<input type="search" id="asm-q" class="rm-sel" placeholder="ابحث باسم أو معنى" value="'+asmEsc(asmS.q)+'" autocomplete="off"><div id="asm-g">'+asmGridHtml()+'</div>';
  else if(asmS.tab==='tasbih'){
    var n=ASM[asmS.idx],pct=(asmS.idx+1)/ASM.length,dn=!!P.learned[n.id];
    h+='<section class="card asm-tb"><button class="asm-ring" data-a="asmstep" data-v="1" aria-label="التالي"><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="104" class="bg"/><circle cx="115" cy="115" r="104" class="fg" stroke-dasharray="653.4" stroke-dashoffset="'+(653.4*(1-pct)).toFixed(1)+'"/></svg><span><b>'+n.n+'</b><small>'+ar(n.o)+' من ٩٩</small></span></button>'
     +'<div class="acts"><button class="btn ghost" data-a="asmstep" data-v="-1">→</button><button class="btn ghost" data-a="asmopen" data-v="'+n.id+'">التفاصيل</button><button class="btn ghost" data-a="asmstep" data-v="1">←</button></div>'
     +'<p class="asm-mn">'+asmEsc(n.m)+'</p><p class="asm-txt">'+asmEsc(n.e)+'</p>'
     +'<button class="btn'+(dn?'':' ghost')+'" data-a="asmmark" data-v="'+n.id+'">'+(dn?'★ مُعلَّمة كمحفوظة':'☆ وضع علامة «حفظتها»')+'</button></section>';
  }else{
    if(!asmS.qz)asmQuizNew();
    var z=asmS.qz,cc=ASM.filter(function(y){return y.id===z.c})[0];
    h+='<section class="card asm-qz"><small>'+(z.ask?'ما معنى هذا الاسم؟':'أي اسم يدل على هذا المعنى؟')+'</small><h2>'+(z.ask?cc.n:asmEsc(cc.m))+'</h2><div class="asm-opts">'
     +z.opts.map(function(id){var o=ASM.filter(function(y){return y.id===id})[0],cl=z.ans?(id===z.c?' correct':(id===z.ans?' wrong':'')):'';return '<button class="asm-opt'+cl+'" data-a="asmans" data-v="'+id+'">'+(z.ask?asmEsc(o.m):o.n)+'</button>'}).join('')
     +'</div><p class="asm-sc">صحيح: <b>'+ar(asmS.ok)+'</b> · خطأ: <b>'+ar(asmS.bad)+'</b></p></section>';
  }
  return h+'<p class="note">ورد في الحديث: «إنّ لله تسعةً وتسعين اسمًا، مائةً إلا واحدًا، من أحصاها دخل الجنة» (متفق عليه). يُحفظ تقدّمك على هذا الجهاز فقط.</p></div>';
}
function asmAct(a,v){
  var P=asmP();
  if(a==='asmtab'){asmS.tab=v;asmS.cur=null;if(v==='quiz'&&!asmS.qz)asmQuizNew();return true}
  if(a==='asmopen'){asmS.cur=v;try{window.scrollTo(0,0)}catch(e){}return true}
  if(a==='asmback'){asmS.cur=null;return true}
  if(a==='asmstep'){asmS.idx=(asmS.idx+(+v)+ASM.length)%ASM.length;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}return true}
  if(a==='asmmark'){P.learned[v]=!P.learned[v];save();toast(P.learned[v]?'أُضيف إلى أسمائك المحفوظة':'أُزيل من أسمائك المحفوظة');return true}
  if(a==='asmshare'){var x=ASM.filter(function(y){return y.id===v})[0],t=x.n+' — '+x.m+'\n\n'+x.e;try{if(navigator.share){navigator.share({text:t});return false}}catch(e){}try{navigator.clipboard.writeText(t);toast('تم نسخ الاسم ومعناه')}catch(e){toast('تعذّر النسخ')}return false}
  if(a==='asmans'){var z=asmS.qz;if(!z||z.ans)return false;z.ans=v;if(v===z.c)asmS.ok++;else asmS.bad++;try{navigator.vibrate&&navigator.vibrate(v===z.c?20:[15,40,15])}catch(e){}
    setTimeout(function(){if(tab==='asma'&&asmS.tab==='quiz'){asmQuizNew();render()}},1300);return true}
  return false;
}
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='asm-q'){asmS.q=e.target.value;var g=document.getElementById('asm-g');if(g)g.innerHTML=asmGridHtml()}
});

/* ===== حصن المسلم (الأذكار) + المسبحة: شاشتان منفصلتان ===== */
var hsnS={cat:null};
var HSN_PRE=['سُبْحَانَ اللَّهِ','الْحَمْدُ لِلَّهِ','اللَّهُ أَكْبَرُ','لَا إِلَٰهَ إِلَّا اللَّهُ','أَسْتَغْفِرُ اللَّهَ'];
function hsnP(){
  var P=S.hisn;if(!P||typeof P!=='object')P=S.hisn={fs:22,d:'سُبْحَانَ اللَّهِ',t:99,c:0,tt:0,tn:0,all:0,prog:{}};
  if(!Array.isArray(P.cus))P.cus=[];
  if(P.snd===undefined)P.snd=true;
  if(P.pd!==dk()){P.pd=dk();P.prog={}}
  if(P.td!==dk()){P.td=dk();P.tt=0}
  return P;
}
/* «أذكار» الواجهة الرئيسية وكل الروابط القديمة (الإشعارات والبطاقات) تفتح حصن المسلم */
var HSN_MAP={morning:'sabah',evening:'massa',afterprayer:'afterPrayer',sleep:'sleep'};
function hsnRedirect(){if(tab==='tasbih'){tab='msb';return}tab='hisn';hsnS.cat=null}
function hsnOpen(g){tab='hisn';hsnS.cat=(HSN_MAP[g]&&HSN[HSN_MAP[g]])?HSN_MAP[g]:null}
function hsnRem(P,slug,i){var k=slug+':'+i,v=P.prog[k];return v===undefined?HSN[slug].items[i].repeat:v}
function hsnDone(P,slug){var c=0;HSN[slug].items.forEach(function(it,i){if(hsnRem(P,slug,i)<=0)c++});return c}
function vHisn(){
  var P=hsnP(),h='<div class="hsn">';
  if(hsnS.cat){
    var cat=HSN[hsnS.cat],dn=hsnDone(P,hsnS.cat);
    h+='<div class="hsn-top"><button class="btn ghost" data-a="hsnback">← الأذكار</button><b class="hsn-cn">'+cat.name+'</b><span class="hsn-fs"><button class="btn ghost" data-a="hsnfs" data-v="-2">أ-</button><button class="btn ghost" data-a="hsnfs" data-v="2">أ+</button></span></div>'
     +'<div class="asm-bar"><i id="hsn-pb" style="width:'+Math.round(dn/cat.items.length*100)+'%"></i></div>'
     +cat.items.map(function(it,i){var r=hsnRem(P,hsnS.cat,i),dn=r<=0;
       return '<div class="card hsn-z'+(dn?' done':'')+'" data-a="hsnz" data-v="'+hsnS.cat+':'+i+'" style="font-size:'+P.fs+'px"><div class="hsn-t">'+it.text+'</div><div class="hsn-b"><small>'+(it.virtue||'')+'</small><span class="hsn-c'+(dn?' done':'')+'">'+(dn?'✓':ar(r))+'</span></div></div>'}).join('');
    return h+'</div>';
  }
  h+='<div class="asm-grid">'+Object.keys(HSN).map(function(s){var c=HSN[s],dn=hsnDone(P,s);return '<button class="asm-card" data-a="hsncat" data-v="'+s+'"><i class="asm-dot'+(dn===c.items.length?' on':'')+'"></i><div class="hsn-ic">'+c.icon+'</div><b>'+c.name+'</b><span>'+ar(dn)+' / '+ar(c.items.length)+'</span></button>'}).join('')+'</div>';
  return h+'<p class="note">الأذكار من حصن المسلم وما ثبت من القرآن والسنة. يُحفظ تقدّمك اليومي على هذا الجهاز ويتجدد كل يوم.</p></div>';
}

function hsnAct(a,v){
  var P=hsnP();

  if(a==='hsnback'){hsnS.cat=null;return true}
  if(a==='hsnfs'){P.fs=Math.max(16,Math.min(32,P.fs+(+v)));save();return true}
  if(a==='hsnz'){
    var p=v.split(':'),s=p[0],i=+p[1],r=hsnRem(P,s,i);if(r<=0)return false;
    r--;P.prog[s+':'+i]=r;save();try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
    var c=document.querySelector('[data-a=hsnz][data-v="'+v+'"]');
    if(c){var n=c.querySelector('.hsn-c');if(r<=0){c.classList.add('done');n.classList.add('done');n.textContent='✓';toast('أحسنت، أُنجز هذا الذكر ✓')}else n.textContent=ar(r)}

function msbAct(a,v){

    if(P.t<1000&&P.c===P.t){try{navigator.vibrate&&navigator.vibrate([30,50,30])}catch(e){}toast('أتممت العدد، أحسن الله إليك 🌙')}
    hsnRing(P);return false}
  if(a==='msbreset'){P.c=0;P.tn=0;save();return true}
  if(a==='msbundo'){if(P.c>0&&P.tn>0){P.c--;P.tn--;P.tt=Math.max(0,P.tt-1);P.all=Math.max(0,P.all-1);save();hsnRing(P)}return false}
  if(a==='msbd'){P.d=v;P.c=0;P.tn=0;save();return true}
  if(a==='msbt'){P.t=+v;save();return true}
  if(a==='msbsnd'){P.snd=!P.snd;save();if(P.snd)msbClick();var b=document.getElementById('msb-snd');if(b){b.classList.toggle('on',!!P.snd);b.setAttribute('aria-pressed',!!P.snd);b.innerHTML=msbSndLbl(P.snd)}return false}

    var i=document.getElementById('msb-new'),t=i?i.value.replace(/\s+/g,' ').trim():'';
    if(!t){toast('اكتب الذكر أولًا');return false}
    if(HSN_PRE.concat(P.cus).indexOf(t)>=0){P.d=t;save();return true}
    if(P.cus.length>=30){toast('بلغت الحد الأقصى ٣٠ ذكرًا');return false}
    P.cus.push(t);P.d=t;P.c=0;P.tn=0;save();toast('أُضيف الذكر ✓');return true}
  if(a==='msbdel'){var k=+v,x=P.cus[k];if(x===undefined)return false;P.cus.splice(k,1);if(P.d===x)P.d=HSN_PRE[0];save();return true}
  return false;
}

        h.style.cssText='top:'+(r.top-pad)+'px;left:'+(r.left-pad)+'px;width:'+(r.width+pad*2)+'px;height:'+(r.height+pad*2)+'px';

function handlePhotoInput(input){
  var file=input.files&&input.files[0];if(!file){toast('لم يتم اختيار صورة');return}
  toast('جارٍ تجهيز الصورة…');
  if(file.type&&!/^image\//.test(file.type)){toast('يرجى اختيار صورة صالحة');input.value='';return}
  if(file.size>20*1024*1024){toast('الصورة كبيرة، يرجى اختيار صورة أصغر من ٢٠ ميجابايت');input.value='';return}
  var reader=new FileReader();
  reader.onerror=function(){toast('لم نتمكن من قراءة الصورة، حاول اختيارها مرة أخرى');input.value=''};
  reader.onload=function(){
    var img=new Image();
    img.onerror=function(){toast('لم نتمكن من فتح الصورة، جرّب صورة بصيغة JPG أو PNG');input.value=''};
    img.onload=function(){
      try{
        /* صورة الملف الشخصي تظهر بحجم صغير؛ نخزن نسخة خفيفة جداً لتفادي امتلاء localStorage */
        var maxSide=144, scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
        var w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
        var h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
        var canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
        if(!ctx){toast('لم نتمكن من تجهيز الصورة على هذا الجهاز');input.value='';return}
        var data='';
        for(var attempt=0;attempt<5;attempt++){
          canvas.width=w;canvas.height=h;
          ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          data=canvas.toDataURL('image/jpeg',attempt<2?.52:.42);
          if(data.length<=70000)break;
          w=Math.max(48,Math.round(w*.78));h=Math.max(48,Math.round(h*.78));
        }
        if(!data||data.length>100000){toast('لم نتمكن من تصغير الصورة، جرّب صورة أخرى');input.value='';return}
        S.profile=S.profile||{name:'',age:'',photo:''};
        S.profile.photo=data;
        saveNow();
        var raw=localStorage.getItem(KEY),verify=null;
        try{verify=raw?JSON.parse(raw):null}catch(ignore){}
        if(!verify||!verify.profile||verify.profile.photo!==data){
          toast('لم تُحفظ الصورة لامتلاء مساحة التخزين. يمكنك حذف بعض البيانات أو تجربة صورة أخرى.');
          input.value='';return;
        }
        /* حدّث كل أماكن الصورة فوراً مع الاحتفاظ بموضع الصفحة */
        var y=window.scrollY||document.documentElement.scrollTop||0;
        render();
        requestAnimationFrame(function(){window.scrollTo(0,y)});
        toast('تم حفظ الصورة الشخصية وتطبيقها');
      }catch(err){toast('لم تُحفظ الصورة، يرجى المحاولة مرة أخرى')}
      input.value='';
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

      if(did&&!dw.length)return;
      var pre=parseInt(r.prayPre,10)||0;
      if(pre>0){var pm=mins(t,t)-pre;if(pm>=0)daily('prep_'+p[0],'بقي '+pre+' دقيقة على صلاة '+p[1],'استعدّ للصلاة وتهيّأ لها بالوضوء.',fmt(pm),fmt(pm),'tab:prayers',null,dw)}
      daily('pray_'+p[0],'حان وقت صلاة '+p[1],'قم إلى الصلاة، تقبّل الله منك.',t,t,'tab:prayers',{k:'pray:'+p[0],l:'صلّيت'},dw);
    });
    var fr=S.fasting&&S.fasting.reminders;
    (r.custom||[]).forEach(function(cu){
      if(!cu||!cu.t||!cu.time||cu.on===false)return;
      var cn=Math.max(1,Math.min(12,parseInt(cu.n,10)||1)),ce=Math.max(5,parseInt(cu.ev,10)||30),c0=mins(cu.time,'07:00'),cdone=(r.cuDone||{})[cu.id]===TK,cdw=(cu.dow&&cu.dow.length)?cu.dow.slice():[];
      if(cdone){cdw=exd(cdw);if(!cdw.length)return}
      for(var ci=0;ci<cn;ci++){var cm=c0+ci*ce;if(cm>=1440)break;var ct=fmt(cm);
        daily('cu_'+cu.id+'_'+ci,cn>1?cu.t+' ('+(ci+1)+'/'+cn+')':cu.t,'ذكّرك: '+cu.t,ct,ct,'',{k:'cu:'+cu.id,l:'تم'},cdw)}
    });
    if(r.fasting&&fr&&fr.enabled){      var today=new Date();today.setHours(0,0,0,0);
      for(var i=0;i<=21;i++){
        var d=new Date(today);d.setDate(d.getDate()+i);var rs=fastingReasons(d);if(!rs.length)continue;
        var key=dk(d),why=rs.join(' · ');
        if(fastingStatus(key)==='done')continue;
        if(fr.suhoor)one('fs_'+key,'تذكير السحور',why,d,fr.suhoorTime,'03:30','tab:fasting',{k:'fast:done',l:'صمت'});
        if(fr.iftar)one('fi_'+key,'تذكير الإفطار','حان وقت الإفطار. لا تنسَ الدعاء.',d,fr.iftarTime,'17:00','tab:fasting',{k:'fast:done',l:'صمت'});
        if(fr.beforeDay){var e=new Date(d);e.setDate(e.getDate()-1);one('fb_'+key,'غدًا يوم صيام',why,e,'20:00','20:00','tab:fasting')}
      }
    }
    /* تنبيه قبل المناسبات الهجرية (أول ليلة 20:00) ويوم المناسبة 07:30 */
    if(r.occ!==false&&typeof occCache==='function'){try{occCache().forEach(function(o){
      if(o.days>3)return;var key=dk(o.date),e=new Date(o.date);e.setDate(e.getDate()-1);
      one('oc_b_'+key,'غدًا: '+o.n,'تذكير بقرب المناسبة.',e,'20:00','20:00','tab:occasions');
      if(o.n.indexOf('البيض')<0)one('oc_d_'+key,'اليوم: '+o.n,'بارك الله لك في يومك.',o.date,'07:30','07:30','tab:occasions');
    })}catch(e){}}
    /* وضع هادئ للمصلين: تُؤجَّل التذكيرات غير الصلاة إذا وقعت في أول ٢٠ دقيقة بعد وقت الصلاة */
    if(typeof S!=='undefined'&&S.calm){
      var PTc=(S&&S.ptimes)||{},starts=[];Object.keys(PTc).forEach(function(k){var mm=/^(\d{1,2}):(\d{2})$/.exec(PTc[k]||'');if(mm&&k!=='sunrise')starts.push(parseInt(mm[1],10)*60+parseInt(mm[2],10))});
      out.forEach(function(x){if(typeof x.h!=='number'||/^(pray_|prep_)/.test(x.id))return;var k=x.h*60+x.m;starts.forEach(function(st){if(k>=st&&k<st+20){var t=(st+21)%1440;x.h=Math.floor(t/60);x.m=t%60;k=t}})});
    }
    /* لا يتزاحم إشعاران في الدقيقة نفسها: يبقى إشعار الصلاة في وقته وتُزاح البقية دقيقة أو أكثر */
    (function(){
      var taken={};function share(a,b){return !a||!a.length||!b||!b.length||a.some(function(d){return b.indexOf(d)>=0})}
      var pr=function(x){return /^(pray_|prep_)/.test(x.id)?0:(/^salat_/.test(x.id)?2:1)};
      out.map(function(x,i){return [x,i]}).sort(function(a,b){return pr(a[0])-pr(b[0])||a[1]-b[1]}).forEach(function(z){
        var x=z[0];if(typeof x.h!=='number')return;
        var g=0;while(g<6){var k=x.h*60+x.m,list=taken[k]||[],hit=list.some(function(o){return share(o,x.dow)});if(!hit)break;var t=k+1;x.h=Math.floor((t%1440)/60);x.m=t%60;g++}
        var kk=x.h*60+x.m;(taken[kk]=taken[kk]||[]).push(x.dow||[]);
      });
    })();
    return out;
  }
  var lastW='';
  function wsync(){
    var n=nat();if(!n||typeof n.setWidget!=='function'||typeof S==='undefined')return;
    try{
      var out=[],now=Date.now();
      for(var dd=0;dd<3;dd++){
        var day=new Date(now+dd*86400000),T=null;
        try{if(typeof locOk==='function'&&locOk())T=ptCompute(day,S.loc.lat,S.loc.lng,S.loc.method||'egypt',S.loc.asr||1)}catch(e){}
        T=T||S.ptimes||{};
        PR.forEach(function(p){var m=/^(\d{1,2}):(\d{2})$/.exec(T[p[0]]||'');if(!m)return;
          var at=new Date(day.getFullYear(),day.getMonth(),day.getDate(),parseInt(m[1],10),parseInt(m[2],10),0,0).getTime();
          if(at>now-60000)out.push({n:p[1],at:at,t:(typeof ptFmt==='function'?ptFmt(T[p[0]]):T[p[0]])})});
      }
      var hj='';try{var hd=hijriNumeric(new Date());hj=ar(hd.day)+' '+['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'][hd.month-1]}catch(e){}
      var bw='';try{bw=typeof boWidget==='function'?boWidget():''}catch(e){}
      var js=JSON.stringify({l:out.slice(0,12),h:hj,b:bw});
      if(js===lastW)return;lastW=js;n.setWidget(js);
    }catch(e){}
  }
  function sync(force){
    var n=nat();if(!n||typeof S==='undefined')return;wsync();
    var items=build();if(typeof isFem==='function'&&isFem())items.forEach(function(x){if(String(x.id).indexOf('cu_')!==0){x.title=femStr(x.title);x.body=femStr(x.body)}});
    var sig=JSON.stringify(items);
    if(!force&&sig===lastSig)return;
    lastSig=sig;try{n.setSchedule(sig)}catch(e){}
  }
  window.alsaerUpcoming=function(max){
    var items=[];try{items=build()}catch(e){return []}
    var now=new Date(),out=[];
    items.forEach(function(x){
      var at=null;
      if(typeof x.at==='number'){at=x.at}
      else if(typeof x.h==='number'){
        for(var i=0;i<8&&!at;i++){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,x.h,x.m,0,0);
          if(d.getTime()>now.getTime()&&(!x.dow||!x.dow.length||x.dow.indexOf(d.getDay())>=0))at=d.getTime()}
      }
      if(at&&at>now.getTime())out.push({t:x.title,at:at});
    });
    out.sort(function(a,b){return a.at-b.at});
    var seen={};out=out.filter(function(o){var k=String(o.t).replace(/\s*\d+$/,'');if(seen[k])return false;seen[k]=1;return true});
    return out.slice(0,max||5).map(function(o){var d=new Date(o.at),td=d.toDateString()===now.toDateString();
      var hm=(typeof ptFmt==='function')?ptFmt((d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()):d.toTimeString().slice(0,5);
      return {t:o.t,w:(td?'اليوم ':['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()]+' ')+hm}});
  };
  setInterval(function(){try{if(!document.hidden&&window.alsaerUpRefresh)window.alsaerUpRefresh()}catch(e){}},20000);
  function syncSoon(force){clearTimeout(timer);timer=setTimeout(function(){sync(force===true)},1200)}
  window.alsaerNativeSyncSoon=syncSoon;
  function go(route){
    var p=String(route).split(':');
    if(p[0]==='tab'&&p[1]){tab=p[1];window.scrollTo(0,0);render()}
    else if(p[0]==='adk'&&p[1]){group=p[1];hsnOpen(p[1]);window.scrollTo(0,0);render()}
    else if(p[0]==='quran'&&p[1]==='start'){var st=S.quran.pos;rd={from:st,to:Math.min(604,st+S.quran.goal-1),page:st};tab='reader';render();window.scrollTo(0,0)}
    else if(p[0]==='sura'){tab='quran';S.quran.sura=p.slice(1).join(':');save();render();window.scrollTo(0,0)}
  }
  window.alsaerPoll=function(quiet){
    var n=nat();if(!n||typeof S==='undefined')return;
    var changed=false,list=[];
    try{list=JSON.parse(n.takePending()||'[]')}catch(e){}
    list.forEach(function(x){
      var k=dk(new Date(x.t||Date.now())),a=String(x.a||'').split(':');
      if(a[0]==='pray'&&PR.some(function(q){return q[0]===a[1]})){S.prayers[k]=S.prayers[k]||{};S.prayers[k][a[1]]=true;changed=true}
      else if(a[0]==='salat'){S.salawat=S.salawat||{};S.salawat[k]=(S.salawat[k]||0)+1;changed=true}
      else if(a[0]==='cu'&&a[1]){var rc=remLoad();rc.cuDone=rc.cuDone||{};rc.cuDone[a[1]]=k;remSave(rc)}
      else if(a[0]==='book'&&a[1]){if(typeof boFromNotif==='function'&&boFromNotif(a[1],k))changed=true}
      else if(a[0]==='fast'&&a[1]==='done'){S.fasting.records=S.fasting.records||{};S.fasting.records[k]='done';changed=true}
    });
    if(changed){save();if(typeof checkNew==='function')checkNew();if(typeof toast==='function')toast('تم تسجيل إجابتك من الإشعار')}
    var route='';try{route=n.takeRoute()||''}catch(e){}
    if(route)go(route);else if(changed)render();
    if(quiet!==true)syncSoon();
  };
  /* أي حفظ لبيانات التطبيق أو إعدادات التذكير يعيد مزامنة الجدول */
  var _save=save;save=function(){var r=_save.apply(this,arguments);syncSoon();return r};
  document.addEventListener('change',function(){syncSoon()},true);
  document.addEventListener('click',function(){syncSoon()},true);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)window.alsaerPoll()});
  window.addEventListener('focus',function(){window.alsaerPoll()});
  window.addEventListener('pageshow',function(){window.alsaerPoll()});
  setInterval(function(){if(!document.hidden)window.alsaerPoll(true)},5000);
  function remLoad(){var x=null;try{x=JSON.parse(localStorage.getItem(REM_KEY)||'null')}catch(e){}return Object.assign(cfg(),x||{})}
  function remSave(x){try{localStorage.setItem(REM_KEY,JSON.stringify(x))}catch(e){}}
  function permOk(){var n=nat();try{return !!(n&&n.notificationsEnabled&&n.notificationsEnabled())}catch(e){return false}}
  function enableNow(){var r=remLoad();if(!r.consent||!r.enabled){r.consent=true;r.enabled=true;remSave(r)}syncSoon(true)}
  function enableOnce(){var r=remLoad();if(!r.autoOn){r.autoOn=true;r.consent=true;r.enabled=true;remSave(r);syncSoon(true)}}
  window.alsaerNotifOk=function(){var r=remLoad();return permOk()&&r.consent&&r.enabled};
  window.alsaerNotifFix=function(){
    var n=nat();if(!n)return;
    if(permOk()){enableNow();return}
    try{n.requestNotificationPermission()}catch(e){}
    var t=0,iv2=setInterval(function(){t++;if(permOk()){clearInterval(iv2);enableNow();if(typeof render==='function')render();if(typeof toast==='function')toast('تم تفعيل الإشعارات')}else if(t>60)clearInterval(iv2)},500);
  };
  function autoEnable(){
    var n=nat();if(!n||typeof S==='undefined'||!S.onboarded)return;
    if(permOk()){enableOnce()}
    else if(!S.notifAsked&&!document.hidden){S.notifAsked=1;save();window.alsaerNotifFix()}
  }
  var _poll=window.alsaerPoll;window.alsaerPoll=function(){try{autoEnable()}catch(e){}return _poll.apply(this,arguments)};
  var tries=0,iv=setInterval(function(){tries++;if(nat()){clearInterval(iv);window.alsaerPoll();sync(true)}else if(tries>40)clearInterval(iv)},500);
})();

})();
