<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; worker-src 'self' blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com; font-src 'self' data:; connect-src 'self' blob: data: https://bayan.alwa7i.com https://api.alquran.cloud https://cdn.jsdelivr.net https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="أحمد العجمي">
<meta name="theme-color" content="#061d1a">
<title>السائر إلى الله</title>
<style>
:root{
  --bg:#061a17; --bg2:#0a2621; --surface:#0d2a25; --surface-2:#133630; --fg:#eef4ee; --muted:#9db5ab; --line:#1f4a3f;
  --gold:#dcb871; --gold-2:#b98d3f; --gold-soft:#2f3a22; --on-gold:#1b2418;
  --primary:var(--gold); --on-primary:var(--on-gold);
  --good:#46b48a; --bad:#d0706a; --shadow:0 8px 26px rgba(0,0,0,.28);
  --btn1:#ecd08c; --btn2:#c79a49;
  --font-ui:'Tajawal','Noto Sans Arabic','Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;
  --font-text:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef2ea; --bg2:#e3ebe2; --surface:#ffffff; --surface-2:#eaf0e8; --fg:#16312a; --muted:#62786e; --line:#d3dfd2;
  --gold:#9a7226; --gold-2:#7d5b17; --gold-soft:#f3ead6; --on-gold:#ffffff;
  --good:#23805a; --bad:#b64f4a; --shadow:0 6px 20px rgba(22,49,42,.08);
  --btn1:#2f7d68; --btn2:#1d6654; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
/* ALSAER: منع قائمة (قص/نسخ/لصق) عند الضغط في أي مكان فارغ — التحديد متاح فقط في حقول الإدخال والمقاطع المسموحة */
html,body{-webkit-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable="true"],.tin input,.allow-select{-webkit-user-select:text;-ms-user-select:text;user-select:text;-webkit-touch-callout:default}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 62%) fixed;color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.6;direction:rtl;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) 96px max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0}
h2{font-size:21px;font-weight:800;margin:14px 0 6px}
h3{font-size:16px;font-weight:700;margin:0 0 10px}
p{margin:0 0 10px}
small,.muted{color:var(--muted)}
.gold{color:var(--gold)}
.serif{font-family:var(--font-text)}

/* top bar for sub pages */
.top{position:relative;top:auto;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 0 12px;max-width:560px;margin:0 auto;background:linear-gradient(var(--bg) 70%,transparent)}
.top h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.top h1 svg.i{color:var(--gold)}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ib.gold{color:var(--gold)}

/* cards */
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--surface-2) 55%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow);position:relative}
.card.flat{box-shadow:none}
.scene{position:relative;border-radius:22px;overflow:hidden;height:152px;margin:4px 0 12px;border:1px solid var(--line);background:#07211d}
.scene svg{display:block;width:100%;height:100%}
.pillday{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(4,20,17,.78);border:1px solid rgba(220,184,113,.25);color:#eef4ee;border-radius:14px;padding:3px 18px;font-size:14px;backdrop-filter:blur(6px);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:15px;padding:12px 18px;min-height:48px;font:inherit;font-weight:800;
  background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold);cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35);text-decoration:none}
.btn.good{background:linear-gradient(180deg,#4fc29a,#2f8f6e);color:#fff}
.btn.bad{background:linear-gradient(180deg,#d9807a,#b0524d);color:#fff}
.btn.ghost{background:color-mix(in srgb,var(--surface-2) 80%,transparent);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.btn:active,.ib:active,.tile:active,.tab:active,.lrow:active{transform:scale(.98)}
.btn:focus-visible,.tab:focus-visible,.day:focus-visible,.chip:focus-visible,.ib:focus-visible,.icon:focus-visible,.tile:focus-visible,.lrow:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.icon{background:transparent;border:0;color:var(--fg);padding:6px 10px;cursor:pointer;display:grid;place-items:center;font:inherit;font-size:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1 1 120px}
.between{justify-content:space-between;flex-wrap:nowrap}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}

/* inputs */
textarea,input[type=text],input[type=password],input[type=number]{width:100%;background:color-mix(in srgb,var(--surface-2) 80%,transparent);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;min-width:0}
textarea{min-height:76px;resize:vertical;margin-bottom:10px}
textarea:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px}
.tmw{position:relative;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;cursor:pointer;min-height:34px;padding:0 4px}.tmw svg.i{width:16px;height:16px}.tmw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

/* splash */
.splash{position:fixed;inset:0;z-index:100;background:#04100e;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 24px calc(54px + env(safe-area-inset-bottom,0px));animation:fade .5s ease}
.splash .bgsvg{position:absolute;inset:0;width:100%;height:100%}
.splash .t{position:relative;font-family:var(--font-text);font-size:50px;font-weight:700;color:#e8c883;line-height:1.3;text-shadow:0 4px 22px rgba(220,184,113,.35)}
.splash .s{position:relative;color:#d6e3dc;font-size:17px;margin:4px 0 26px;line-height:1.7}
.splash .ld{position:relative;width:min(240px,60%);height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.splash .ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ccfb7,#dcb871);border-radius:4px;animation:load 1.7s ease forwards}
@keyframes load{to{width:100%}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* onboarding */
.obh{text-align:center;margin:26px 0 6px}
.obh h2{font-size:30px;margin:0 0 6px}
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.gc{border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-2),var(--surface));border-radius:20px;padding:20px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--fg);font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.gc svg{width:84px;height:84px}
.gc.on{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 50%,transparent),var(--shadow)}
.hero-scene{height:190px;border-radius:0 0 26px 26px;overflow:hidden;margin:0 -16px;position:relative}
.hero-scene svg{width:100%;height:100%;display:block}

/* home */
.greet{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 0 4px}
.greet small{display:block;font-size:14px}
.greet .nm{font-family:var(--font-text);font-size:22px;color:var(--gold);font-weight:700;line-height:1.4}
.greet h1{font-size:27px;font-weight:800;display:flex;align-items:center;gap:8px;line-height:1.3}
.greet h1 svg.i{color:var(--good);width:26px;height:26px}
.banner{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);padding:18px 16px;margin:12px 0;min-height:112px;
  background:linear-gradient(120deg,#0e3a30 0%,#0a2a26 60%,#0c3b3a 100%);color:#eef4ee}
:root[data-theme="light"] .banner{background:linear-gradient(120deg,#1d6654,#2f8a72);}
.banner svg.deco{position:absolute;left:-6px;bottom:-6px;width:150px;height:110px;opacity:.55}
.banner h3{font-size:20px;color:#f0f5ee;margin:0 0 6px;position:relative}
.banner p{font-size:14px;color:#cfe0d8;margin:0;position:relative;line-height:1.8;max-width:78%;font-family:var(--font-text);font-size:16px}
.banner small{position:relative;color:#b7cfc5;display:block;margin-top:2px}
.dprog b{font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:color-mix(in srgb,var(--surface-2) 90%,#000);overflow:hidden;margin-top:8px}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#5fc9a9,var(--gold))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-2),var(--surface));border-radius:20px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
.tile svg.i{width:36px;height:36px;color:var(--gold);stroke-width:1.5}
.tile small{font-size:12px;font-weight:500}
.sect{font-size:17px;font-weight:800;margin:20px 0 4px;display:flex;align-items:center;gap:8px}
.sect svg.i{color:var(--gold)}

/* ring / stats */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 14px 16px;overflow:hidden}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:color-mix(in srgb,var(--surface-2) 90%,#000)}.ring .pg{stroke:var(--gold);transition:stroke-dashoffset .6s ease}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.count{font-size:46px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.ring .mid small{font-size:13px}
.next{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;margin-top:6px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.wk i{width:100%;max-width:34px;aspect-ratio:1;border-radius:11px;background:color-mix(in srgb,var(--surface-2) 85%,transparent);border:1px solid var(--line);display:grid;place-items:center}
.wk i svg{width:15px;height:15px}
.wk.success i{background:var(--good);border-color:var(--good);color:#fff}
.wk.relapse i{background:var(--bad);border-color:var(--bad);color:#fff}
.wk.today span{color:var(--gold)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat small{font-size:12px;font-weight:600}
.stat.g b{color:var(--good)}.stat.r b{color:var(--bad)}.stat.o b{color:var(--gold)}

.quote{border-right:3px solid var(--gold)}
.quote p,.ar{font-family:var(--font-text);font-size:21px;line-height:2;margin:0 0 8px}
.quote small,.ar+small{display:block}
.tipc{border-right:3px solid var(--good)}
.sos{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#a94d4b,#cf726c);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;margin:14px 0;box-shadow:0 8px 20px rgba(169,77,75,.25)}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tg button,.chip{border:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 80%,transparent);color:var(--fg);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tg button.on,.chip.on{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold);border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;font-size:15px}
.chip input{width:auto;margin-left:6px}

/* checklist (prayers & habits) */
.cl{display:flex;flex-direction:column;gap:10px}
.cli{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px;width:100%;color:var(--fg);font:inherit;text-align:right}
button.cli{cursor:pointer}
.cli .nm{flex:1;font-size:17px;font-weight:700}
.cli .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:transparent}
.cli.sq .ck{border-radius:8px}
.cli.on .ck{background:var(--good);border-color:var(--good);color:#fff}
.cli .ck svg{width:16px;height:16px;stroke-width:3}
.cli.on .nm{color:var(--fg)}
.cli .tm{color:var(--muted);font-size:13px}
.cli .x{background:transparent;border:0;color:var(--muted);padding:4px;cursor:pointer;display:grid;place-items:center}
.cli .x svg{width:18px;height:18px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addbtn{width:100%;margin-top:12px;border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold);border-radius:15px;padding:13px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.rateline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rateline b{font-size:26px;color:var(--good)}

/* quran */
.qhero{position:relative;border-radius:22px;overflow:hidden;height:150px;border:1px solid var(--line);margin:4px 0 12px;background:#07211d}
.qhero svg{width:100%;height:100%;display:block}
.step{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 12px}
.step b{font-size:34px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.step .ib{width:46px;height:46px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0}
.wd{text-align:center;color:var(--muted);font-size:12px}
.day{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--fg);font:inherit;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.day.success{background:var(--good);color:#fff;border-color:var(--good)}.day.relapse{background:var(--bad);color:#fff;border-color:var(--bad)}
.day.today{outline:2px solid var(--gold);outline-offset:1px;background:color-mix(in srgb,var(--gold) 80%,transparent);color:var(--on-gold);border-color:var(--gold)}
.legend{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 0 0 5px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mhead h2{margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border:1px solid var(--line);border-radius:16px;padding:5px;margin:6px 0 14px}
.seg button{border:0;border-radius:12px;padding:9px;font:inherit;font-weight:700;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold)}
.bigring{position:relative;width:190px;height:190px;margin:8px auto 14px}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigring .mid b{font-size:42px;font-weight:800;line-height:1.1}
.cheer{display:flex;align-items:center;gap:12px}
.cheer svg.i{color:var(--good);width:28px;height:28px}
.cheer b{font-size:19px;color:var(--gold);display:block}

/* list rows (more / settings / developer) */
.lrows{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.lrow{display:flex;align-items:center;gap:14px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:58px;color:var(--fg);font:inherit;text-align:right;width:100%;cursor:pointer;text-decoration:none}
.lrow svg.i{color:var(--gold)}
.lrow .t{flex:1;font-size:17px;font-weight:700;line-height:1.4}
.lrow .t small{display:block;font-weight:400;font-size:12px}
.lrow .chev{color:var(--muted);width:18px;height:18px}
.sw{position:relative;width:52px;height:30px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#cdd9d3;transition:transform .2s}
.sw.on{background:var(--good);border-color:var(--good)}
.sw.on::after{transform:translateX(-22px);background:#fff}
.devc{text-align:center;padding:22px 16px}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;border:2px solid var(--gold);background:radial-gradient(circle,var(--surface-2),var(--surface));color:var(--gold);font-family:var(--font-text);font-size:46px;font-weight:700;box-shadow:0 0 28px color-mix(in srgb,var(--gold) 22%,transparent)}
.chipv{display:inline-block;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);border-radius:12px;padding:2px 12px;font-size:13px;font-weight:700}

/* achievements & others */
ol{padding-right:22px;line-height:2;margin:0 0 12px}
ul{padding:0;margin:0 0 10px;list-style:none}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.8;border-bottom:1px solid var(--line);padding:4px 0}
.tips li{display:list-item;list-style:disc;margin-right:18px;border:0;padding:3px 0}
.timer{font-size:52px;text-align:center;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;margin:6px 0}
.counter{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-size:20px;font-weight:800;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold);cursor:pointer;font-variant-numeric:tabular-nums}
.dhikr.done{opacity:.6}
.sum{display:flex;align-items:center;gap:14px}
.sum b{font-size:34px;font-variant-numeric:tabular-nums}
.rank{display:inline-block;background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);border-radius:10px;padding:2px 10px;font-weight:700;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.bd .hex{width:56px;height:62px;display:grid;place-items:center;position:relative;color:var(--muted)}
.bd .hex svg.h{position:absolute;inset:0;width:100%;height:100%;fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.bd .hex span{position:relative;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.bd .hex svg.i{position:relative}
.bd b{font-size:14px;line-height:1.3}.bd small{font-size:12px;line-height:1.35}
.bd.got{background:var(--gold-soft);border-color:var(--gold)}
.bd.got .hex{color:var(--gold)}.bd.got .hex svg.h{stroke:var(--gold)}
.bd .bar{width:100%;height:5px;margin-top:4px}
.ins{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.ins>span:first-child{width:92px;flex:none}
.ins .bar{flex:1;margin:0}
.ins b{width:34px;text-align:left;font-variant-numeric:tabular-nums}

:root{
  --font-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --bg:#061A1D;--bg2:#061A1D;--surface:#0D252A;--surface-2:#143238;--fg:#E2F3F2;--muted:#8DB1B1;--line:rgba(226,243,242,.10);
  --brand:var(--ac-d,#0E8A86);--brand-2:var(--ac2-d,#0A4A51);--brand-ink:#fff;
  --gold:var(--ac-g,#5FCFC1);--gold-2:var(--ac-d,#0FB3A6);--on-gold:#fff;--btn1:var(--ac-d,#0E8A86);--btn2:var(--ac-d,#0E8A86);
  --good:#3CC487;--warn:#E5A93A;--bad:#EE6B55;
  --card-a:var(--surface);--card-b:var(--surface);--edge:transparent;--glow:transparent;--ico:var(--ac-g,#5FCFC1);--nav:var(--surface);

}
:root[data-theme="light"]{
  --bg:#EEF6F6;--bg2:#EEF6F6;--surface:#FFFFFF;--surface-2:#E0EEEE;--fg:#0E2528;--muted:#53706F;--line:rgba(14,37,40,.10);
  --brand:var(--ac-l,#017D84);--brand-2:var(--ac2-l,#00535F);--gold:var(--ac-l,#017D84);--gold-2:var(--ac-l,#0FB3A6);--ico:var(--ac-l,#017D84);--btn1:var(--ac-l,#017D84);--btn2:var(--ac-l,#017D84);
  --good:#1F8A5B;--warn:#C98A0B;--bad:#C2412D;--shadow:0 1px 2px rgba(14,37,40,.06),0 8px 24px rgba(14,37,40,.06);
}
html{background:var(--bg)}
body{font-family:var(--font-ui);background:radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,var(--brand) 9%,transparent) 0%,transparent 60%) no-repeat,var(--bg);background-size:100% 520px;background-attachment:scroll;padding-bottom:104px}
button,input,textarea,select{font-family:inherit}
.card,.tile,.stat,.cli,.lrow,.gc,.bd,.astat,.seg{background:var(--surface);border:0;box-shadow:var(--shadow)}

/* press / transitions (same easing as the reference) */

.astats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.astat{padding:14px 8px;text-align:center;border-radius:20px}
.astat small{font-size:.9rem;font-weight:500;color:var(--muted);display:block}
.astat b{font-size:1.9rem;font-weight:700;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.badges{gap:12px}
.bd{border-radius:20px;padding:16px 8px 12px;gap:8px}
.bd .bi{position:relative;width:56px;height:56px;display:grid;place-items:center;color:var(--brand)}
:root:not([data-theme="light"]) .bd .bi{color:var(--gold)}
.bd .bi svg.i{width:54px;height:54px;stroke-width:1.3;filter:none}
.bd .bi span{position:absolute;top:11px;left:0;right:0;text-align:center;font-weight:700;font-size:16px;color:var(--brand);line-height:1.2}
:root:not([data-theme="light"]) .bd .bi span{color:var(--gold)}
.bd .bi span.s3{font-size:12px;top:13px}
.bd:not(.got) .bi{opacity:.4}
.bd b{font-size:.98rem;line-height:1.35}
.bd small{color:var(--muted)}
.bd.got{background:var(--surface);border:0}
.bd .okc{color:var(--good);display:grid;place-items:center}.bd .okc svg.i{width:26px;height:26px;stroke-width:3}

/* reminders (in-app) */
.rem{display:flex;gap:14px;align-items:flex-start}
.rem .ri{color:var(--brand);flex:none}.rem .ri svg.i{width:30px;height:30px;stroke-width:1.6}
.rem h4{margin:0 0 4px;font-size:1.05rem;font-weight:700}
.rem .acts{display:flex;gap:10px;margin-top:12px}
.rem .acts .btn{flex:1;min-height:44px;border-radius:14px;padding:8px 12px;font-size:.95rem}

/* splash (reference: tile rises, word writes itself) */
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spWrite{to{clip-path:inset(0 0 0 0)}}
.splash{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0}
.splash .sp-tile{width:96px;height:96px;border-radius:27px;position:relative;overflow:hidden;background:linear-gradient(135deg,#12E3D2 0%,#02A5A4 50%,#00535F 100%);box-shadow:0 14px 30px -12px rgba(0,83,95,.55);opacity:0;transform:translateY(46px) scale(.88);animation:spUp .46s cubic-bezier(.2,.9,.25,1.15) forwards;display:grid;place-items:center}
.splash .sp-tile svg{width:64px;height:64px}
.splash .t{font-family:var(--font-ui);font-weight:700;font-size:2rem;line-height:1.2;color:var(--fg);white-space:nowrap;clip-path:inset(0 0 0 100%);animation:spWrite .42s .28s cubic-bezier(.45,0,.2,1) forwards;background:none;-webkit-background-clip:border-box;filter:none}
.splash .s{color:var(--muted);font-size:.95rem;font-weight:500;text-align:center;opacity:0;animation:spUp .4s .6s ease forwards;transform:translateY(6px)}
.splash .ld{height:5px;background:var(--surface-2);width:min(200px,56%);border-radius:999px;overflow:hidden}
.splash .ld i{background:linear-gradient(90deg,#7DF4E2,#A6FBEB)}
.splash .ver{display:none}
.gc{border-radius:20px}
.chipv{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.avatar{box-shadow:none}
@media(max-width:380px){.splash .t{font-size:1.7rem}.tile{font-size:.92rem}.gh h1{font-size:1.3rem}.top h1{font-size:1.3rem}}

/* quran reader controls */
.rbar{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--line)}
.rbar .ib{border-radius:14px;background:var(--surface-2);border:0}
.mp{box-shadow:var(--shadow);border:0}
:root{--pg-a:#0F2F33;--pg-b:#0B2428}
:root[data-theme="light"]{--pg-a:#FFFFFF;--pg-b:#F4FAFA}

/* ---- palette styles ---- */
:root[data-style="midnight"][data-theme="dark"]{--bg:#000;--surface:#0E0E11;--surface-2:#1A1A1F;--fg:#F2F2F5;--muted:#9A9AA5;--line:rgba(255,255,255,.12);--shadow:0 0 0 1px rgba(255,255,255,.05)}
:root[data-style="royal"][data-theme="dark"]{--bg:#0A1020;--surface:#121A2E;--surface-2:#1B2540;--fg:#EDE6D3;--muted:#9AA3B8;--line:rgba(212,175,55,.20);--shadow:0 1px 2px rgba(0,0,0,.4)}
:root[data-style="paper"][data-theme="light"]{--bg:#F6F1E7;--surface:#FFFBF3;--surface-2:#EDE5D6;--fg:#2B2118;--muted:#7A6A58;--line:rgba(43,33,24,.12);--shadow:0 1px 2px rgba(43,33,24,.06),0 8px 24px rgba(43,33,24,.06);--pg-a:#FFFDF6;--pg-b:#F7F1DD}
:root[data-style="paper"][data-theme="dark"]{--bg:#17130E;--surface:#221C15;--surface-2:#2E261D;--fg:#EFE6D6;--muted:#A8998A;--line:rgba(239,230,214,.12)}
:root[data-style="ocean"][data-theme="light"]{--bg:#EAF3F8;--surface:#FFFFFF;--surface-2:#DCEAF2;--fg:#0B2A3C;--muted:#52707F;--line:rgba(11,42,60,.10)}
:root[data-style="ocean"][data-theme="dark"]{--bg:#07141D;--surface:#0E2230;--surface-2:#153042;--fg:#E4F0F6;--muted:#8FAEBD;--line:rgba(228,240,246,.12)}


:root[data-theme="light"] .banner{background:repeating-radial-gradient(circle at 12% 120%,rgba(255,255,255,.06) 0 1px,transparent 1px 9px),linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%)}
:root[data-look="flat"] .banner,:root[data-theme="light"][data-look="flat"] .banner{background:var(--brand)}
/* ---- looks ---- */
:root[data-look="flat"]{--shadow:none;--r-card:12px;--r-hero:16px}
:root[data-look="flat"] body{background:var(--bg)}
[data-look="flat"] .card,[data-look="flat"] .tile,[data-look="flat"] .lrow,[data-look="flat"] .cli,[data-look="flat"] .bd,[data-look="flat"] .astat,[data-look="flat"] .bell{box-shadow:none;border:1px solid var(--line)}
[data-look="flat"] .banner{background:var(--brand);box-shadow:none}[data-look="flat"] .banner::after{display:none}
[data-look="flat"] .tile,[data-look="flat"] .lrow,[data-look="flat"] .cli{border-radius:12px}
[data-look="compact"] #app,[data-look="compact"] #top{zoom:.92}
[data-look="compact"] .card{padding:12px;margin-bottom:10px}[data-look="compact"] .banner{padding:14px 16px 12px;min-height:0}
[data-look="comfy"] #app,[data-look="comfy"] #top{zoom:1.08}
[data-look="comfy"] .btn{min-height:56px}
:root[data-look="soft"]{--r-card:28px;--r-hero:32px}
[data-look="soft"] .tile,[data-look="soft"] .lrow,[data-look="soft"] .cli,[data-look="soft"] .bd,[data-look="soft"] .astat{border-radius:26px}
[data-look="soft"] .btn,[data-look="soft"] .seg,[data-look="soft"] .seg button,[data-look="soft"] .addbtn{border-radius:999px}
[data-look="soft"] input,[data-look="soft"] textarea{border-radius:20px}
[data-look="soft"] .tile{background:color-mix(in srgb,var(--brand) 12%,var(--surface))}

/* ---- press / transition variants ---- */
@keyframes pressSoft{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes pressGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}100%{box-shadow:0 0 0 12px color-mix(in srgb,var(--brand) 0%,transparent)}}
@keyframes pressRip{from{transform:scale(0);opacity:.28}to{transform:scale(1);opacity:0}}
[data-press="soft"] .pressed,[data-press="soft"] .tab.pressed .pill{animation:pressSoft .22s ease}

[data-press="none"] .pressed,[data-press="none"] .tab.pressed .pill{animation:none}

.rp-clip{position:relative;overflow:hidden}

@keyframes viewSlide{from{opacity:.15;transform:translate3d(-40px,0,0)}to{opacity:1;transform:none}}

[data-trans="zoom"] .vin{animation:viewZoom .24s cubic-bezier(.2,.8,.2,1) both}

/* ثيم لمسة (أُرجواني ناعم) وثيم وردي — موجّهان للذائقة الأنثوية */
:root[data-style="lamsa"][data-theme="light"]{--bg:#FBF3FF;--surface:#FFFFFF;--surface-2:#F3E5FB;--fg:#3A1A4A;--muted:#7F6A8C;--line:rgba(166,63,196,.18);--shadow:0 8px 26px -12px rgba(166,63,196,.28);--gold:#A63FC4;--gold-2:#7E2A99;--on-gold:#fff;--brand:#A63FC4;--r-card:26px;--r-hero:30px}

:root[data-style="rose"][data-theme="light"]{--bg:#FFF1F5;--surface:#FFFFFF;--surface-2:#FFE3EC;--fg:#47182B;--muted:#8E6577;--line:rgba(214,51,108,.18);--shadow:0 8px 26px -12px rgba(214,51,108,.28);--gold:#D6336C;--gold-2:#A8244F;--on-gold:#fff;--brand:#D6336C;--r-card:26px;--r-hero:30px}
:root[data-style="rose"][data-theme="dark"]{--bg:#240F18;--surface:#341826;--surface-2:#45213A;--fg:#FFEAF1;--muted:#CBA3B4;--line:rgba(245,138,176,.24);--shadow:0 10px 30px -14px rgba(0,0,0,.6);--gold:#F58AB0;--gold-2:#E0558A;--on-gold:#3A0F20;--brand:#D6336C;--r-card:26px;--r-hero:30px}
:root[data-style="lamsa"] .wk-bn,:root[data-style="lamsa"] .banner{background:linear-gradient(150deg,#A63FC4,#5E2A7C)}

:root[data-style="lamsa"] .btn,:root[data-style="rose"] .btn{border-radius:999px}

/* ثيم فجر */
:root[data-style="fajr"][data-theme="dark"]{--bg:#0E1626;--surface:#16233A;--surface-2:#1F3152;--fg:#F4EEE4;--muted:#A9B4C8;--line:rgba(255,176,103,.22);--shadow:0 10px 30px -14px rgba(0,0,0,.6);--gold:#FFB067;--gold-2:#E48A3A;--on-gold:#2A1606;--brand:#E48A3A;--r-card:24px}

.seg.n4{grid-template-columns:repeat(4,1fr)}
/* Personalized profile and time-aware greeting */
.welcome-line{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;margin:0 0 9px;color:var(--gold)}
.welcome-line svg.i{width:25px;height:25px}
.welcome-line.is-morning svg.i{color:#e8bd63;filter:drop-shadow(0 0 7px rgba(232,189,99,.35))}
.welcome-line.is-evening svg.i{color:#b8c8e8;filter:drop-shadow(0 0 7px rgba(184,200,232,.35))}
.profile-avt{overflow:hidden;display:grid;place-items:center}
.profile-photo{display:block;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:var(--surface-2)}
.profile-avatar-large .profile-photo,.profile-edit-head .profile-photo{filter:brightness(1.42) contrast(1.08) saturate(1.06)}
.profile-avt .profile-photo{filter:brightness(1.45) contrast(1.08) saturate(1.05)}
.profile-edit-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}

/* Dual Gregorian and Hijri calendar strip */

/* Fasting planner and private habit tracker */
.fasting-hero{background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--gold) 18%,var(--surface)),var(--surface));text-align:center}
.fasting-icon{width:54px;height:54px;margin:0 auto 8px;border-radius:18px;display:grid;place-items:center;color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.fasting-icon svg.i{width:30px;height:30px}
.fasting-today{display:flex;flex-direction:column;gap:3px;padding:12px;margin:14px 0;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface-2) 75%,transparent)}
.fasting-today span{color:var(--gold);font-weight:800}
.fast-options{display:flex;flex-direction:column;gap:8px}
.fast-option{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--fg);font:inherit;text-align:right;width:100%;margin:7px 0}
button.fast-option{cursor:pointer}
.fast-option>span:nth-child(2),.fast-option>span:first-child{display:flex;flex-direction:column;gap:2px;flex:1}
.fast-option small{font-size:12px;color:var(--muted)}
.fast-option.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.fast-check{width:25px;height:25px;flex:none;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--gold)}
.fast-check svg.i{width:16px;height:16px}
.fast-next{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fast-next:last-of-type{border-bottom:0}
.fast-next>div{display:flex;flex-direction:column;min-width:100px}
.fast-next small{font-size:11px;color:var(--muted)}
.fast-next>span{font-size:13px;color:var(--gold);text-align:left}
.toggle{border:1px solid var(--line);border-radius:20px;padding:7px 12px;background:var(--surface);color:var(--muted);font:inherit;font-size:12px;white-space:nowrap}
.toggle.on{background:color-mix(in srgb,var(--good) 15%,var(--surface));border-color:var(--good);color:var(--good)}
.habits-summary .bar{margin:10px 0}
.bad-sect{color:var(--bad)}
.bad-habit{border-color:color-mix(in srgb,var(--bad) 28%,var(--line))}
.habit-count{min-width:28px;text-align:center;font-weight:900;color:var(--bad);font-size:18px;font-variant-numeric:tabular-nums}
.count-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.count-btn.plus{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.fast-alert{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}

.profile-identity{flex:1;min-width:0}.profile-identity h1{font-size:21px;line-height:1.3;font-weight:900;overflow-wrap:anywhere}.profile-identity .welcome-line{font-size:13px;margin:0 0 4px;gap:5px}.profile-identity .welcome-line svg.i{width:17px;height:17px}.profile-sub{font-size:12px;color:var(--muted);margin-top:4px}

.worship-card{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--gold) 9%,var(--surface)),var(--surface))}
.worship-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.worship-head h2{font-size:23px;margin:0}.eyebrow{font-size:11px;color:var(--gold);font-weight:800}.worship-head .note{margin:2px 0 0}.worship-score{width:68px;height:68px;flex:none;border-radius:22px;background:color-mix(in srgb,var(--gold) 15%,var(--surface-2));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center}.worship-score b{font-size:25px;line-height:1.1;color:var(--gold)}.worship-score small{font-size:10px}.worship-progress{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 10px}.worship-list{display:flex;flex-direction:column;gap:7px}.worship-row{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface-2) 75%,transparent)}.worship-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-width:0}.worship-name svg.i{width:18px;height:18px;color:var(--gold)}.worship-actions{display:flex;gap:5px;flex:none}.worship-choice{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:68px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font:inherit;font-size:11px;font-weight:800}.worship-choice svg.i{width:13px;height:13px}.worship-choice.yes.selected{color:var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}.worship-choice.no.selected{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}.worship-privacy{font-size:11px;text-align:center;margin:10px 0 0}
.hadith-card{border-color:color-mix(in srgb,var(--gold) 35%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--gold) 8%,var(--surface)),var(--surface))}.hadith-title{display:flex;align-items:center;gap:8px;color:var(--gold);margin-bottom:10px}.hadith-title b{flex:1}.hadith-text{font-family:var(--font-text);font-size:20px;line-height:1.9;text-align:center;margin:4px 0 12px}.hadith-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}.hadith-meta b{color:var(--good)}.hadith-source{display:block;text-align:center;color:var(--gold);font-size:11px;text-decoration:none;margin-top:7px}

/* Refined home hierarchy: daily reset, animated hadith, and personal identity */
.new-day-card{position:relative;overflow:hidden;margin:4px 0 12px;padding:16px 16px 14px;border-radius:24px;border:1px solid color-mix(in srgb,var(--gold) 34%,var(--line));background:radial-gradient(circle at 12% 0%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 44%),linear-gradient(135deg,color-mix(in srgb,var(--ac-l) 18%,var(--surface)),var(--surface));box-shadow:var(--shadow);isolation:isolate}
.new-day-card:after{content:"";position:absolute;inset:auto -34px -58px auto;width:190px;height:190px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:50%;box-shadow:0 0 0 18px color-mix(in srgb,var(--gold) 5%,transparent),0 0 0 38px color-mix(in srgb,var(--gold) 4%,transparent);z-index:-1}
.new-day-card .new-day-kicker{text-align:center;color:var(--gold);font-size:10px;letter-spacing:2px;font-weight:900;margin-bottom:6px}
.new-day-card h3{text-align:center;font-size:25px;line-height:1.4;font-weight:950;margin:0 0 8px;background:linear-gradient(90deg,var(--fg),var(--gold),var(--fg));background-size:180% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:dayShimmer 7s ease-in-out infinite}
.new-day-card p{text-align:center;font-size:14px;line-height:1.9;margin:0 auto;max-width:36em}
.new-day-card small{display:block;text-align:center;color:var(--gold);margin-top:7px;font-weight:800}
@keyframes dayShimmer{0%,100%{background-position:0% center}50%{background-position:100% center}}
.hadith-reveal{position:relative;overflow:hidden;isolation:isolate;animation:hadithEnter .75s cubic-bezier(.2,.8,.2,1) both;background:linear-gradient(145deg,color-mix(in srgb,var(--gold) 12%,var(--surface)),var(--surface) 68%);border:1px solid color-mix(in srgb,var(--gold) 42%,var(--line));box-shadow:0 12px 34px color-mix(in srgb,var(--gold) 9%,transparent)}
.hadith-reveal:before{content:"";position:absolute;inset:-80% auto auto -20%;width:170px;height:170px;border-radius:50%;background:color-mix(in srgb,var(--gold) 10%,transparent);filter:blur(8px);animation:hadithGlow 5s ease-in-out infinite;z-index:-1}
.hadith-orbit{position:absolute;top:12px;inset-inline-end:14px;width:28px;height:28px;color:var(--gold);pointer-events:none;opacity:.85}
.hadith-orbit span{position:absolute;inset:2px;display:grid;place-items:center;font-size:19px;animation:starPulse 2.8s ease-in-out infinite}
.hadith-orbit i{position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:50%;animation:orbitPulse 3.2s ease-out infinite}
.hadith-reveal .hadith-title{padding-inline-end:32px}
.hadith-reveal .hadith-text{animation:hadithTextIn 1s .12s both;text-wrap:pretty}
.hadith-reveal .hadith-meta,.hadith-reveal .hadith-source{animation:hadithTextIn .8s .28s both}
@keyframes hadithEnter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes hadithTextIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes hadithGlow{0%,100%{transform:translate(0,0) scale(.85);opacity:.45}50%{transform:translate(28px,18px) scale(1.3);opacity:.9}}
@keyframes starPulse{0%,100%{transform:scale(.82) rotate(-10deg);opacity:.65}50%{transform:scale(1.12) rotate(12deg);opacity:1}}
@keyframes orbitPulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.65);opacity:0}}
.profile-hero{padding:17px;border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--ac-l) 13%,var(--surface)),var(--surface) 72%);border:1px solid color-mix(in srgb,var(--ac-l) 22%,var(--line))}
.profile-avatar-large{border-radius:50%;width:82px;height:82px;padding:3px;box-shadow:0 5px 18px color-mix(in srgb,var(--gold) 17%,transparent)}
.profile-avatar-large .profile-photo{width:72px!important;height:72px!important;border-radius:50%}

.profile-identity .welcome-line{font-weight:850;color:var(--gold)}
.age-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--ac-l) 10%,var(--surface-2));border:1px solid var(--line);font-size:11px;font-weight:800}
.profile-preview{padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(130deg,color-mix(in srgb,var(--ac-l) 9%,var(--surface)),var(--surface-2));margin-bottom:14px}
.profile-preview .profile-edit-head{margin:0}
.profile-edit-head{display:flex;align-items:center;gap:14px}
.profile-edit-head .profile-photo{border-radius:22px;object-fit:cover;border:2px solid var(--gold);padding:2px;background:var(--surface)}
.profile-label{display:block;margin:13px 0 6px;font-size:13px;font-weight:850;color:var(--gold)}

.profile-file{width:100%;border-radius:14px!important;background:var(--surface-2)!important}
.worship-summary .worship-progress{margin:10px 0 12px}
.worship-open{display:flex;align-items:center;justify-content:center;gap:8px}

.wk-pt{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.wk-pt .rm-sel{font-size:14px!important;padding:6px 8px!important;min-height:0!important;height:40px}.wk-pt input[type=time]{flex:0 0 118px;width:118px}.wk-pt input:not([type=time]){flex:1 1 100%;min-width:0}.wk-add .rm-sel{font-size:14px!important;height:44px;min-height:0!important}

.wk-bn-cd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:800;font-size:14px}.wk-bn-cd b{font-variant-numeric:tabular-nums;direction:ltr}
.wk-tb{margin:0 0 12px}.wk-short{padding:14px}.hc-btns{display:flex;flex-direction:column;gap:8px}
/* ===== 1.2.1 ===== */

.sec2-m.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px color-mix(in srgb,var(--gold) 28%,transparent)}

.sec2-off{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:12px;border-radius:16px;border:1px dashed color-mix(in srgb,#d4574a 55%,var(--line));background:transparent;color:#d4574a;font:inherit;font-weight:700;cursor:pointer}

.sura-tile em,.adk-tile small{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.sura-tile.blink em{color:var(--gold);font-weight:800}
.sura-tile.done,.tile.done{opacity:.82}.sura-tile.done em,.tile.done small{color:#3fae6a;font-weight:800}
.dn-badge{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#3fae6a;color:#fff;font-size:13px}
.rm-help{margin-top:12px}.rm-help h4{margin:0 0 6px}.rm-help .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* ===== 1.2.0 ===== */

.qib{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border-radius:26px;background:color-mix(in srgb,var(--gold) 8%,var(--surface));border:1px solid var(--line)}
.qib-dial{position:relative;flex:0 0 92px;width:92px;height:92px;border-radius:50%;border:2px solid color-mix(in srgb,var(--gold) 50%,var(--line));display:grid;place-items:center;background:var(--bg)}

.wr-row span{flex:1;font-size:14px}.wr-row b{font-size:15px}.wr-row em{font-style:normal;min-width:54px;text-align:center;font-size:12px;font-weight:900;padding:4px 8px;border-radius:999px}

:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 80%,#fff);outline-offset:2px}
.chip{min-width:44px}

/* ===== إدخال الوقت الرقمي ===== */

.tmw-d{display:inline-flex;align-items:center}

.nx-card{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px 16px;margin:2px 0 12px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,var(--surface),var(--surface-2));color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;transition:transform .15s,box-shadow .2s;animation:nxin .45s ease both}
.nx-card:active{transform:scale(.98)}

@media (prefers-reduced-motion:reduce){.nx-card{animation:none}}
/* بلاطات الاختبار */
.rm-tests{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))!important;gap:12px}
.rm-test{min-height:104px;justify-content:center;padding:14px 4px!important;border-radius:20px!important;font-size:13.5px;font-weight:700;line-height:1.3;text-align:center}

.rm-test:active{transform:scale(.96)}

select,.rm-sel{line-height:1.5!important;min-height:48px;padding-block:10px!important;padding-inline:14px 34px!important;text-overflow:ellipsis}

.dpk-btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-weight:700;cursor:pointer;flex:1}

.dpk-sh{width:100%;max-width:480px;background:var(--surface);color:var(--fg);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .22s cubic-bezier(.2,.8,.2,1)}

.dpk-ft{display:flex;gap:10px;margin-top:12px}.dpk-ft .btn{flex:1}
/* سجل التحديثات: خط زمني */

.rm-pane{display:none}.rm-pane.on{display:block;animation:nxin .25s ease both}

.pt-loc{display:flex;align-items:center;gap:12px;padding:12px;margin:10px 0 0;border-radius:18px;border:1px dashed var(--line);background:var(--surface-2)}

/* ===== مصحف مزخرف: واجهة أقرب لتطبيقات المصحف الورقية (شريط بنّي علوي وشريط كريمي سفلي) ===== */

/* ===== زخرفة على نمط المصحف المدني: لافتة السورة ورقم الصفحة (الروايتان) ===== */
.mp.pgc-ornate .ml.hd>span{position:relative;border:2px solid #b98a2e;box-shadow:0 0 0 2px #f6ecd6 inset,0 0 0 3.5px #b98a2e inset;border-radius:8px;font-weight:700;letter-spacing:.02em;background:linear-gradient(180deg,#fbf3df,#efe0bd)}
.mp.pgc-ornate .ml.hd>span::before,.mp.pgc-ornate .ml.hd>span::after{content:'\2766';position:absolute;top:50%;transform:translateY(-52%);color:#b98a2e;font-size:.8em}
.mp.pgc-ornate .ml.hd>span::before{right:10px}.mp.pgc-ornate .ml.hd>span::after{left:10px;transform:translateY(-52%) scaleX(-1)}
.mp.pgc-ornate .mp-f .pn{min-width:0;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border:2px double #b98a2e;border-radius:50%;background:radial-gradient(circle,#fbf3df,#efe0bd);font-size:13px}

/* ===== مصحف الصور (طبعة المدينة) ===== */
.mp.mpi{background:transparent;display:flex;align-items:center;justify-content:center}
.mp.mpi .mp-in{border:0!important;border-image:none!important;background:transparent!important;padding:0!important;box-shadow:none!important;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;height:100%}
.mp.mpi .mp-h{width:100%;display:flex!important;justify-content:space-between;padding:2px 14px;font-size:12px;color:#7a4a14}.mp.mpi .mp-h .sb{border:0;background:none;padding:0}
.mp.mpi .mp-f{flex:none;padding-top:4px}
.mp.mpi .pgi{position:relative;flex:none;background:#fbf7ec;box-shadow:0 2px 14px rgba(0,0,0,.28);border-radius:3px;overflow:hidden;touch-action:pan-y}
.mp.mpi .pgi-i{position:absolute;inset:0;width:100%;height:100%;opacity:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mp.mpi .pgi.ok .pgi-i{opacity:1}.mp.mpi .pgi.ok .pgi-ld{display:none}.mp.mpi .pgi.bad .pgi-ld{display:none}
.mp.mpi .pgi-ov{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply}
.pgb{position:absolute;border-radius:6px}.pgb.hl{background:rgba(255,196,60,.42);box-shadow:0 0 10px 2px rgba(255,170,30,.5);animation:pgglow 1.8s ease-in-out infinite}@keyframes pgglow{0%,100%{box-shadow:0 0 6px 1px rgba(255,170,30,.35)}50%{box-shadow:0 0 16px 4px rgba(255,170,30,.7)}}.pgb.mk{background:rgba(67,217,160,.25);border-bottom:3px solid #1b9c78}
.pgi-ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8a5a36;font-size:13px}
.pgi-ld i{width:34px;height:34px;border:3px solid #e2d4bc;border-top-color:#8a5a36;border-radius:50%;animation:mpspin .9s linear infinite}@keyframes mpspin{to{transform:rotate(360deg)}}
.mpi-bar{height:8px;border-radius:6px;background:#e9dfca;overflow:hidden;margin:6px 0}.mpi-bar i{display:block;height:100%;background:#8a5a36;transition:width .3s}
.mp.mpi{background:#f4ecda!important}.mp.mpi .mp-f{display:none}
.mp.mpi .pgi.ok .pgi-i{animation:pgfade .18s ease-out}@keyframes pgfade{from{opacity:.55}to{opacity:1}}

/* ===== وضع صور المصحف: لون الصفحة والسماكة والسطوع تعمل على الصورة نفسها ===== */
.mp.mpi{--fth:brightness(1);--fco:brightness(1)}
.mp.mpi .pgi-i{filter:var(--fth) var(--fco)}
.mp.mpi.fw1{--fth:url(#mpt1)}.mp.mpi.fw2{--fth:url(#mpt2)}
.mp.mpi.pgc-white{--fco:saturate(.35) brightness(1.06)}
.mp.mpi.pgc-white,.mp.mpi.pgc-white .pgi{background:#fff!important}
.mp.mpi.pgc-sepia{--fco:sepia(.6) saturate(1.1)}
.mp.mpi.pgc-sepia{background:#e6d3a8!important}
.mp.mpi.pgc-black,.mp.mpi.pgc-green,.mp.mpi.pgc-blue{--fco:invert(1) hue-rotate(180deg) brightness(.92)}
.mp.mpi.pgc-black,.mp.mpi.pgc-black .pgi{background:#000!important}
.mp.mpi.pgc-green,.mp.mpi.pgc-green .pgi{background:#0b2e22!important}
.mp.mpi.pgc-blue,.mp.mpi.pgc-blue .pgi{background:#101d3a!important}
.mp.mpi.pgc-green .pgi-i,.mp.mpi.pgc-blue .pgi-i{mix-blend-mode:screen}
.mp.mpi.pgc-black .mp-h,.mp.mpi.pgc-green .mp-h,.mp.mpi.pgc-blue .mp-h{color:#cfcfcf}
.mp.mpi.pgc-black .pgi-ov,.mp.mpi.pgc-green .pgi-ov,.mp.mpi.pgc-blue .pgi-ov{mix-blend-mode:screen}
.mp.mpi.pgc-black .pgb.hl,.mp.mpi.pgc-green .pgb.hl,.mp.mpi.pgc-blue .pgb.hl{background:rgba(255,196,60,.28)}

.mp-tf{width:100%;max-height:34vh;overflow:auto;font-size:15px;line-height:1.95;text-align:right;padding:8px 10px;border-radius:14px;background:var(--surface-2);color:var(--fg);-webkit-overflow-scrolling:touch}

/* أسهم التقليب داخل شريط الصفحة السفلي (لا تغطي الآيات) + زر خروج ظاهر */
.mp-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 8px 0}
.mp-fa{width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--gold);display:grid;place-items:center;padding:0;flex:none;touch-action:manipulation}
.mp-fa .i{width:20px;height:20px}.mp-fa:active{transform:scale(.9)}.mp-fa[disabled]{opacity:.25}
.mp-x{width:34px;height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:transparent;color:var(--gold);font-size:15px;line-height:1;padding:0;flex:none;display:grid;place-items:center;touch-action:manipulation}
.mp.nohd .mp-h{display:flex!important}.mp.nohd .mp-h>span{visibility:hidden}
body.orn .mp-fa{background:#f9f5ee;border-color:#b98a2e;color:#8a5a36}body.orn .mp-x{border-color:#b98a2e;color:#8a5a36}
.rd-ar{display:none!important}
.mp-h>span:first-of-type{margin-inline-end:auto}.mp-h .mp-x{margin-inline-end:8px}
.mp .mp-x{min-width:34px;min-height:34px;width:34px;height:34px;max-height:34px;border-radius:50%;padding:0}

.tour2{position:fixed;inset:0;z-index:9998}
.tour2-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.74),0 0 0 2px var(--gold);pointer-events:none;transition:all .25s}

.tour2-c{position:fixed;left:14px;right:14px;max-width:380px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px 18px 14px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.tour2.mid .tour2-c{position:static;width:100%}
.tour2-e{font-size:46px}.tour2-c h3{margin:4px 0 6px}.tour2-c p{color:var(--muted);line-height:1.8;margin:0 0 10px;font-size:14.5px}
.tour2-n{font-size:12px;color:var(--muted);margin-bottom:8px}.tour2-c .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.home-cfg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:10px 0;padding:11px;border:1px dashed color-mix(in srgb,var(--gold) 45%,transparent);border-radius:16px;background:transparent;color:var(--fg);font:inherit;font-size:14px}

.sc-adv{margin:12px 0;border:1px solid var(--line);border-radius:16px;padding:4px 10px}.sc-adv>summary{cursor:pointer;padding:12px 4px;color:var(--muted);font-size:14px;list-style:none}.sc-adv>summary::-webkit-details-marker{display:none}.sc-adv[open]>summary{color:var(--gold)}
.sc-grid>*:last-child:nth-child(odd){grid-column:1/-1}
.rc{display:flex;flex-direction:column;gap:14px}
.rc-hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line))}
.rc-ring{position:relative;width:84px;height:84px;flex:none}.rc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rc-ring circle{fill:none;stroke-width:7;stroke-linecap:round}.rc-ring .bg{stroke:color-mix(in srgb,var(--muted) 25%,transparent)}.rc-ring .fg{stroke:var(--gold);transition:stroke-dashoffset .5s}
.rc-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.rc-hd small{color:var(--muted);font-size:13px}.rc-hd h2{margin:0 0 8px;font-size:28px;line-height:1.2}
.rc-chips{display:flex;flex-wrap:wrap;gap:6px}.rc-chips span{padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:13px}.rc-chips .g b{color:var(--good)}.rc-chips .r b{color:var(--bad)}
.rc-card{padding:12px}.rc-sel{width:100%;margin-bottom:10px}
.rc-text{max-height:44vh;overflow:auto;line-height:2.5;font-size:25px;font-family:var(--font-text,inherit);padding:10px 6px;text-align:justify;scroll-behavior:smooth}
.rcw{border-radius:8px;padding:1px 3px;color:var(--muted);transition:background .25s,color .25s}.rcw.ok{color:var(--fg)}.rcw.miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:6px}
.rcw.cur{background:color-mix(in srgb,var(--gold) 30%,transparent);color:var(--fg);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 50%,transparent)}
.rcn{color:var(--gold);font-size:.8em;white-space:nowrap}
.rc-ctl{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.rc-mic{width:104px;height:104px;border-radius:50%;border:0;cursor:pointer;color:var(--on-gold,#fff);background:linear-gradient(145deg,var(--gold),color-mix(in srgb,var(--gold) 60%,#000));box-shadow:0 8px 28px color-mix(in srgb,var(--gold) 45%,transparent);display:grid;place-items:center;touch-action:manipulation}
.rc-mic svg{width:46px;height:46px}.rc-mic.on{animation:rcpulse 1.4s infinite;background:linear-gradient(145deg,var(--good),color-mix(in srgb,var(--good) 60%,#000))}.rc-mic.busy{opacity:.7}
@keyframes rcpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 28px transparent}}

@keyframes rcspin{to{transform:rotate(360deg)}}
.rc-again{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;font:inherit;display:inline-flex;gap:6px;align-items:center}.rc-again svg{width:16px;height:16px}
.rc-hear{max-width:100%}.rc-warn{font-size:12.5px;color:var(--muted)}
.rc-sim{display:flex;gap:8px}.rc-sim input{flex:1}
.rc-tools{display:flex;gap:8px;margin:0 0 6px}.rc-tb{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;display:inline-flex;gap:6px;align-items:center}.rc-tb svg{width:15px;height:15px}.rc-tb.on{background:var(--gold);color:var(--on-gold,#000);border-color:var(--gold)}

.rc-ayr{display:flex;gap:8px;align-items:center;margin:8px 0}.rc-ayr .rc-sel{flex:1;margin:0}.rc-ayr .rc-tb:disabled{opacity:.35}
.rc-res .rc-sc{display:flex;align-items:center;gap:14px;margin-bottom:10px}.rc-sr{position:relative;width:78px;height:78px;flex:none}.rc-sr svg{width:100%;height:100%;transform:rotate(-90deg)}.rc-sr circle{fill:none;stroke-width:7;stroke-linecap:round}.rc-sr .bg{stroke:color-mix(in srgb,var(--muted) 25%,transparent)}.rc-sr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.rc-bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.rc-bar span{width:54px}.rc-bar i{flex:1;height:8px;border-radius:6px;background:color-mix(in srgb,var(--muted) 22%,transparent);overflow:hidden}.rc-bar i b{display:block;height:100%;background:var(--gold,#e8c873);border-radius:6px}.rc-bar em{width:38px;text-align:left;font-style:normal;color:var(--muted)}
.rc-wks{display:flex;flex-wrap:wrap;gap:6px}.rc-wk{border:1px solid color-mix(in srgb,var(--gold,#e8c873) 60%,transparent);background:transparent;color:inherit;border-radius:10px;padding:4px 10px;font:inherit;font-size:16px}.rc-wk.miss{border-color:#ff8a7a;color:#ff8a7a}.rc-wk.on{background:color-mix(in srgb,var(--gold,#e8c873) 22%,transparent)}
.rc-wd{margin-top:8px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--muted) 14%,transparent)}.rc-wd b{display:block;font-size:20px}.rc-adv{margin:10px 0}.rc-adv summary{cursor:pointer;color:var(--muted);font-size:13px}

/* ===== تصميم مستوحى من Itqan (ألوان: gold #C9982E / correct #34D399 / error #F87171 / onyx) ===== */
.rc-card{background:#1a1a24;border:1px solid color-mix(in srgb,#c9982e 22%,transparent);border-radius:28px;padding:16px}

.rc-mic.on{background:#f87171;box-shadow:0 0 0 7px color-mix(in srgb,#f87171 22%,transparent),0 8px 30px color-mix(in srgb,#f87171 45%,transparent)}

.rc-wave i{width:5px;height:12px;border-radius:3px;background:#c9982e;animation:rcwv 1s ease-in-out infinite}

.rc-res .rc-sr{width:150px;height:150px}.rc-res .rc-sr b{font-size:44px}
.rc-res .rc-sc{flex-direction:column;text-align:center}.rc-res .rc-sc>div:last-child{order:-1}
.rc-grade{font-size:30px}
.rc-sr .fg{stroke:url(#rcgold)!important}
.rc-h{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-size:16px}.rc-h::after{content:"";flex:1;height:1px;background:var(--line)}
.rc-bar span{width:84px}.rc-bar i{height:10px}.rc-bar i b{background:#34d399}.rc-bar.mid i b{background:#c9982e}.rc-bar em{color:#34d399;font-weight:800;width:30px}.rc-bar.mid em{color:#c9982e}

.rc-note b{font-size:26px;color:#f87171;font-weight:500}.rc-note em{display:block;font-style:normal;color:#f87171;font-size:14px}.rc-note small{color:var(--muted)}

/* ===== شاشة التلاوة بأسلوب «ترتيل»: نص متدفق كالمصحف، الكلمة الحالية مضيئة، ودوك سفلي بالميكروفون ===== */
body.rcs .tabbar{display:none!important}
.rc.rc-t{gap:10px;padding-bottom:240px}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rc-pk{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:16px;padding:8px 12px;font:inherit;text-align:right}

.rc-top .rc-tools{margin:0;flex:none}.rc-top .rc-tb{padding:6px 10px}
.rc-pick{padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.rc-pb{height:4px;border-radius:4px;background:color-mix(in srgb,var(--muted) 22%,transparent);overflow:hidden}.rc-pb i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .35s}
.rc-read{padding:20px 14px;border-radius:26px;background:var(--surface);border:1px solid var(--line);min-height:42vh}

.rcw.ok{color:var(--fg)!important}
.rcw.cur{color:var(--fg)!important;background:color-mix(in srgb,var(--gold) 26%,transparent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 26%,transparent)!important}
.rcw.miss{color:#f87171!important;text-decoration:underline wavy #f87171!important;text-underline-offset:9px}
.rcn{font-size:.62em!important;color:var(--gold)}
.rc-live{text-align:center;min-height:44px}.rc-live .rc-hear{margin:0;color:var(--muted);font-size:14px}
.rc-advb{align-self:center;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:4px 10px}
.rc-dock{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px 8px;border-radius:30px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35)}

.rc-cnt{display:flex;gap:16px;font-size:12px;color:var(--muted)}.rc-cnt b{color:var(--fg)}
.rc-dock .rc-wave{height:30px}
.rc-hifz .rcw:not(.ok):not(.miss):not(.peek){filter:blur(7px)}
.rc.rc-t{max-width:100%;overflow-x:hidden}.rc-status,.rc-hear{overflow-wrap:anywhere;white-space:pre-wrap;max-width:100%}
body.rcs #app.vin,body.rcs #app{animation:none!important;transform:none!important}

/* إعدادات التلاوة (زر ⚙ أعلى الشاشة) */
.rc-gear{font-size:18px;line-height:1;padding:6px 11px!important}.rc-gear.on{background:color-mix(in srgb,var(--gold) 22%,var(--surface-2));border-color:var(--gold)}

.rc-redo{display:block;margin:8px auto 0;border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold);font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:8px 18px}
.rc-hist{display:flex;flex-direction:column;gap:6px}.rc-hr{display:grid;grid-template-columns:minmax(70px,1.2fr) 2fr 42px 40px;align-items:center;gap:8px;font-size:13px}
.rc-hr i{display:block;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--good) var(--w),color-mix(in srgb,var(--fg) 16%,transparent) var(--w))}.rc-hr b{text-align:end}.rc-hr small{color:var(--muted);text-align:end}

/* ===== ترتيب أعلى الشاشة + الإحصائيات + تجميع الإعدادات ===== */
.rc-top{display:block}.rc-pk{width:100%}
.rc-top+.rc-tools,.rc-tools{display:grid!important;grid-template-columns:repeat(5,1fr);gap:6px;margin:0!important}
.rc-tools .rc-tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px!important;border-radius:16px;min-width:0;line-height:1.2}

.rc-tools .rc-tb.on{background:color-mix(in srgb,var(--gold) 22%,var(--surface-2));border-color:var(--gold)}.rc-tools .rc-tb.on small{color:var(--gold)}
.rc-grp{padding:12px;border-radius:18px;background:color-mix(in srgb,var(--fg) 4%,transparent);border:1px solid color-mix(in srgb,var(--fg) 10%,transparent);display:flex;flex-direction:column;gap:8px}

.rc-tile span{font-size:22px}.rc-tile b{font-size:24px;color:var(--gold)}.rc-tile small{color:var(--muted);font-size:12px}
.rc-wtot{margin:0;text-align:center;color:var(--muted);font-size:14px}.rc-wtot b{color:var(--fg)}
.rc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.rc-day{display:flex;flex-direction:column;align-items:center;gap:4px}

.rc-chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 4px;border-radius:14px;background:color-mix(in srgb,var(--fg) 4%,transparent)}
.rc-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0}
.rc-col i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#e8c066,#c9982e)}.rc-col small{font-size:10px;color:var(--muted)}
.rc-empty{text-align:center;padding:10px 0}
.rc-sim{display:none}

/* ===== مربع تحميل النموذج ===== */
html.rc-dlgon,html.rc-dlgon body{overflow:hidden!important;overscroll-behavior:none;touch-action:none}
.rcd-back{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,18,24,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none;overscroll-behavior:none}

.rcd-acts{display:flex;flex-direction:column;gap:8px;margin-top:10px}

.rc-mdl{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--fg) 10%,transparent)}

.rc-mdl .rc-mt{width:100%}
.rc-mdl .rc-mt small{display:block}
.rc-mdl-a{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-height:34px}
.rc-mdl-a .rc-ok{color:#43d9a0;font-size:12.5px;font-weight:700}
.rc-dlp{display:flex;align-items:center;gap:8px;flex:1;min-width:130px}

.rc-dlp em{font-style:normal;font-size:12px;color:var(--muted)}
.asm{display:flex;flex-direction:column;gap:12px;min-width:0;padding-bottom:110px}

.asm-prog>div:first-child{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}.asm-prog b{color:var(--fg)}
.asm-bar{height:8px;border-radius:6px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden;margin-top:8px}.asm-bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s}

.hsn-top{display:flex;align-items:center;gap:8px}.hsn-top .btn{width:auto;flex:none;padding:8px 14px;min-height:0;font-size:14px}.hsn-cn{margin-inline:auto;color:var(--gold);white-space:nowrap}

/* لمسات الشكل والسرعة */
html{-webkit-tap-highlight-color:transparent;scroll-behavior:auto}

.btn{border-radius:14px;transition:transform .12s ease,opacity .15s}
.chip{transition:background-color .15s,color .15s,transform .12s}
.mr-h{letter-spacing:.2px;font-weight:700}

/* ===== 10103: لمسة جمالية عامة (حركة ناعمة · عمق · وضوح) ===== */
.btn,.ib,.tile,.tab,.lrow,.chip{transition:transform .12s ease-out}
.btn:not(.ghost){box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 16px rgba(0,0,0,.18)}

.card{border-color:color-mix(in srgb,var(--line) 80%,var(--gold) 20%)}
.card h3{letter-spacing:.2px}

.tab{border-radius:16px}
.tab.on,.tab.active,.tab[aria-selected="true"]{background:color-mix(in srgb,var(--gold) 16%,transparent)}
::selection{background:color-mix(in srgb,var(--gold) 35%,transparent)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--gold) 40%,transparent) transparent}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--gold) 65%,transparent);outline-offset:1px;border-radius:12px}
@media (prefers-reduced-motion:reduce){.btn,.ib,.tile,.tab,.lrow,.chip{transition:none}}

/* ===== 10106: قوائم أوضح — أيقونات في شارات ملوّنة، عناوين أقسام بشريط ذهبي، ملمس زجاجي خفيف ===== */

.lrow .t{font-size:16.5px}
.lrow .t small{margin-top:2px;opacity:.85}
.lrow .chev{opacity:.55}
.mr-h{position:relative}
.mr-h::before{content:"";display:inline-block;width:4px;height:1em;border-radius:3px;background:var(--gold);margin-inline-end:8px;vertical-align:-2px}
.search input,input[type=search]{border-radius:16px}
.banner{box-shadow:0 10px 28px rgba(0,0,0,.22)}
.tab svg{transition:transform .2s}
.tab.on svg,.tab.active svg{transform:translateY(-1px) scale(1.08)}

/* ===== الأذكار: بطاقة قراءة بعدّاد مقطّع وأدوات (نسخ/مشاركة/مفضلة) ===== */
.adk-chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:4px}.adk-chips::-webkit-scrollbar{display:none}.adk-chips .chip{flex:none}
.adk-sum{margin:10px 0 14px}.adk-sum-t{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.adk-sum-t b{font-size:17px}
.adk-rst{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 85%,transparent);color:var(--gold);font:inherit;font-size:13.5px;font-weight:700;border-radius:14px;padding:9px 12px}

/* توحيد كل مربعات الكتابة + إزالة الوهج الداكن عند اللمس/التركيز/الإكمال التلقائي */
input:not([type]),input[type=text],input[type=search],input[type=number],input[type=password],input[type=email],input[type=url],input[type=tel],textarea,.qd-i,.msb-in{
 -webkit-appearance:none;appearance:none;box-sizing:border-box;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;

function dailyPick(){
  var now=new Date(),sp=[],pool=dailyGeneralPool(),recent=[];
  try{sp=dailySpecial(now)}catch(e){}
  try{recent=JSON.parse(localStorage.getItem('alsaer_daily_recent_v2')||'[]');if(!Array.isArray(recent))recent=[]}catch(e){recent=[]}
  var list=[];
  sp.forEach(function(x){list.push(x,x,x)}); /* التذكيرات المرتبطة بالوقت أكثر حظًا في الظهور دون أن تحتكر البطاقة */
  pool.forEach(function(x){list.push(x)});
  var fresh=list.filter(function(x){return recent.indexOf(x.t)<0});
  if(!fresh.length)fresh=list;
  dailyCardContent=fresh[Math.floor(Math.random()*fresh.length)]||DAILY_SPIRITUAL_CONTENT[0];
  try{recent.unshift(dailyCardContent.t);localStorage.setItem('alsaer_daily_recent_v2',JSON.stringify(recent.slice(0,15)))}catch(e){}
  return dailyCardContent;
}

function dailyApiItems(json){

      var t=(typeof x==='string')?x:cleanHadithText(x&&(x.text||x.arabic||x.ar||x.content||x.hadith||x.verse||x.text_ar||x.matn||x.excerpt||x.snippet||''));

      var s=x.source||x.bookTitle||x.book||x.collection||x.reference||source||'البيان',lk=x.link||x.url||x.href||'';
      out.push({kind:kind,icon:'۞',t:t,s:String(s),grade:x.grade||x.gradeText||'',link:/^https:\/\//i.test(lk)?lk:''});
    });
  }
  [json,json.data].forEach(function(j){if(j&&typeof j==='object'){add(j.hadith,'حديث نبوي','البيان');add(j.verses,'آية وتفسيرها','القرآن الكريم · البيان')}});

function dailyFetch(q){

function refreshDailyCardFromApi(){
  var pk=dailyPack();
  if(dailyPackBusy||typeof fetch!=='function'||(Date.now()-pk.at<20*3600*1000&&pk.items.length>=30))return Promise.resolve(false);
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return Promise.resolve(false);
  dailyPackBusy=true;
  var qs=DAILY_API_QUERIES.slice().sort(function(){return Math.random()-.5}).slice(0,5),items=pk.items.slice(),seen={};
  items.forEach(function(x){seen[x.t]=1});
  return qs.reduce(function(p,q){return p.then(function(){return dailyFetch(q).then(function(j){dailyApiItems(j).forEach(function(x){if(!seen[x.t]){seen[x.t]=1;items.push(x)}})})})},Promise.resolve())
    .then(function(){
      if(items.length>pk.items.length||!pk.at){try{localStorage.setItem(DAILY_PACK_KEY,JSON.stringify({at:Date.now(),items:items.slice(-200)}))}catch(e){}}

    }).catch(function(){dailyPackBusy=false;return false});
}

function dailyArLink(q){
  var l=q.link||'';
  if(/^https:\/\/quran\.com\/(\d)/.test(l))return l.replace('https://quran.com/','https://quran.com/ar/');
  if(/^https:\/\/quran\.com\/ar\//.test(l)||/^https:\/\/[^/]*alwa7i/.test(l)||/^https:\/\/dorar\.net\//.test(l))return l;
  if(/(حديث|دعاء|الصلاة على النبي)/.test(q.kind||'')||/صحيح|رواه|حسن/.test(q.s||'')){
    var w=dailyPlain(q.t).split(' ').slice(0,9).join(' ');
    if(w)return 'https://dorar.net/hadith/search?q='+encodeURIComponent(w);
  }
  return '';
}

async function hashPin(pin,salt){
  if(!window.crypto||!crypto.subtle||!window.TextEncoder)throw new Error('SECURE_CRYPTO_UNAVAILABLE');
  var enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);

  return Array.from(new Uint8Array(bits)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}

  if(!record||record.type!=='pbkdf2-sha256'||!record.salt||!record.hash)return false;

/* الرسم الشرقي: خط الحفص المشرقي لا يملك شكل الياء المغربية (U+06D2)، فتُكتب ياءً عادية */
function warshFix(t){
  return String(t).replace(/\u06D2/g,'\u064A')
    /* ألف الوصل بعلامات ورش (ا۬ / ا۪) تُرسم ٱ في الرسم المشرقي */
    .replace(/(^|[\s\u00A0\u06D6-\u06DF\u064B-\u0652]|[وف][\u064B-\u0652])ا[\u064B-\u0652]?\u06EC/g,'$1\u0671')
    .replace(/(^|[\s\u00A0])ا[\u064B-\u0652]?\u06EA/g,'$1\u0671')

/* نفس warshFix مع إبقاء مصفوفة ألوان التجويد موازية للنص بعد الاستبدال */

  [/(^|[\s\u00A0\u06D6-\u06DF\u064B-\u0652]|[وف][\u064B-\u0652])ا[\u064B-\u0652]?\u06EC/g,/(^|[\s\u00A0])ا[\u064B-\u0652]?\u06EA/g].forEach(function(re){
    var out='',ko=[],last=0,m,x,y;re.lastIndex=0;

      var pl=m[1].length;
      out+=a.slice(last,m.index+pl)+'\u0671';
      if(kk){for(x=last;x<m.index+pl;x++)ko.push(kk[x]);ko.push(kk[m.index+pl])}

var RL_RAW='<p><b>1.0.10 (10145) · الاعتماد على Google وإصلاحات</b><br>أُزيل النموذج المحلي تمامًا (ويُحذف تلقائيًا ما نُزِّل منه). تعرّف Google وحده مع منع إخفاء كلمات القرآن. شاشة الصلوات منفصلة عن الموقع والمواقيت. الشريط السفلي عائم ومعتم. «عبادة جديدة» تفتح عباداتي اليوم مباشرة. وسحب عناصر قوائم التعديل يعمل باللمس الآن.</p><p><b>1.0.10 (10144) · تصحيح فحص الجسر</b><br>أُزيل من فحص «الجسر الأصلي» اسم دالة لم تعد مستخدمة (كانت تُظهر خطأً كاذبًا).</p><p><b>1.0.10 (10143) · فحص التطبيق وكشف الأخطاء</b><br>شاشة جديدة «فحص التطبيق» في المزيد: تسجّل أخطاء التطبيق تلقائيًا، وتفحص التخزين والمصحف وكل الشاشات والجسر الأصلي، وتنسخ تقريرًا للمطوّر. وأي شاشة تفشل تعرض بطاقة خطأ بدل صفحة بيضاء.</p><p><b>1.0.10 (10142) · كتم «بيب» الميكروفون</b><br>خيار في ⚙ التلاوة (مفعّل افتراضيًا) يكتم أصوات الهاتف لحظة بدء الاستماع فقط ثم يعيدها فورًا، دون أي تغيير دائم في مستوى الصوت.</p><p><b>1.0.10 (10141) · إصلاح تحميل نموذج القرآن</b><br>إن تعذّر قراءة الحزمة المخزّنة يُحمَّل النموذج مباشرة بدل الفشل، وتظهر تفاصيل السبب كاملة لتسهيل التشخيص.</p><p><b>1.0.10 (10140) · نموذج القرآن داخل الهاتف</b><br>خيار «نموذج القرآن» في ⚙ التلاوة يعمل بلا إنترنت بعد تنزيله مرة واحدة. عند التنزيل يظهر مربع «جاري التحميل…» مع الاستغفار والنسبة ثم «اكتمل التحميل ✅ اتلُ بارك الله فيك»، ولا يُفتح الميكروفون إلا بعد الاكتمال.</p><p><b>1.0.10 (10139) · إلغاء الوضع الصامت</b><br>التلاوة لم تعد تكتم صوت الهاتف إطلاقًا (كان يسبب مشاكل)، وأُزيل خيار «الوضع الصامت تلقائيًا». ويُعاد تلقائيًا أي صوت بقي مكتومًا من نسخ سابقة.</p><p><b>1.0.10 (10138) · أيقونات وتنقّل</b><br>ترتيب الرئيسية بأسلوب آيفون (ضغطة مطوّلة ← اهتزاز الأيقونات وسحب وإخفاء). «المزيد» شبكة أيقونات متحركة. الشريط السفلي بتصميم تيليجرام مع زر «+» لمهام سريعة. إزالة زر «تخصيص الرئيسية» من الواجهة.</p><p><b>1.0.10 (10137) · تخصيص وتنظيم</b><br>تخصيص الرئيسية: نافذة مستقلة تقفل تمرير الصفحة خلفها وتطبّق التغيير فورًا. «تسجيل اليوم» بتنظيم أوضح (شريط عادات يُمرَّر، عدّادان، وتفاصيل الرغبة مطويّة). المسبحة: تحديد الذكر بالضغط على الشريحة. سجل الإصدارات بأرقام النسخ.</p><p><b>1.0.10 (10136) · شريط عائم وإعدادات أبسط</b><br>شريط تنقّل عائم على طراز تيليجرام. إعدادات التنبيهات والمظهر أبسط مع «خيارات متقدمة» مطويّة. إصلاح خلل عرض مربع «إضافة عبادة» وتوحيد شكل مربعات الكتابة.</p><p><b>1.0.10 (10135) · جولة تفاعلية</b><br>جولة تعريفية تظلّل عناصر التطبيق وتنتقل بين شاشاته (تُعاد من الإعدادات). شاشة التسميع تظهر كاملة، وإعدادات بخمسة أقسام، وتنظيف الأكواد الميتة.</p><p><b>1.0.10 (10134) · المسبحة والتسميع</b><br>«المسبحة» صفحة مستقلة بذكر مخصّص وصوت نقر. «أذكار» الواجهة تفتح حصن المسلم. التسميع: إزالة وضع الكتابة وإضافة إحصائيات (متوسط الدقة وأفضل نتيجة وآخر ٧ أيام). حذف «الأجواء الصوتية».</p><p><b>1.0.10 (10127 – 10133) · صفحات جديدة</b><br>«أسماء الله الحسنى» (٩٩ اسمًا بحفظ واختبار)، «حصن المسلم» (أذكار بعدّاد تكرار)، «الأحاديث النبوية» (تسعة كتب بالبحث والمفضلة وحديث اليوم، تحتاج إنترنت). التسميع بتعرّف Google مع موافقة خصوصية وإيقاف تلقائي للميكروفون.</p><p><b>1.0.10 · أناقة وذكاء</b><br>عربي دائمًا مهما كانت لغة الهاتف. قائمة «المزيد» بأقسام وخانة بحث. نغمة «السائر» للإشعارات وجدولة أذكى. نوافذ عائمة وودجت قابلة للتخصيص. «كتابي»، «ختمة القرآن»، «حاسبة الزكاة»، «قضاء ما فاتك»، «المناسبات الهجرية»، «وضع رمضان»، والنسخ الاحتياطي.</p><p><b>1.2.7 · ضبط رقمي للوقت</b><br>استبدال الساعة الدائرية بضبط رقمي (ساعة ودقيقة وص/م) في كل الشاشات، وعلامة ✓ عند إتمام إعدادات الإشعارات والبطارية مع إخفاء أزرارها.</p><p><b>1.2.6 · عودة المظهر المعتاد</b><br>أُلغي «المظهر الجديد التجريبي» وبقيت ميزاته: بانر «ذكر هذا الوقت»، واختصاراتي، وتعديل القوائم، وإعدادات المصحف، والتذكيرات الذكية.</p><p><b>1.2.5 · تذكيرات ذكية</b><br>الصلاة على النبي ﷺ كل ١٥ أو ٣٠ دقيقة أو ساعة بفترة تختارها، وورد القرآن لا يُرسَل إذا أتممته، وتنبيه قبل الأذان وتخطّي الصلاة المسجّلة، وتقرير أسبوعي بأرقامك، وتذكيرك الخاص بعدد مرات وفاصل تحدده، وأزرار تفاعلية في الإشعار.</p><p><b>1.2.4 · إصلاح تفعيل الإشعارات</b><br>تفعيل جدول التذكيرات تلقائيًا عند منح الإذن، وطلب الإذن عند أول فتح، وتنبيه على الرئيسية إذا كانت الإشعارات متوقفة، وبطاقة فحص تبيّن سبب أي تأخير، /* ===== خمس ميزات: وضع رمضان · ختمة القرآن · إحصاءات أسبوعية · ملاحظات ومفضلة · حاسبة الزكاة ===== */
function f5n(v,max){var n=parseFloat(String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(',','.'));return isFinite(n)&&n>=0?Math.min(n,max||1e12):0}
function f5ar(n){return ar(Math.round(n*100)/100)}

function f5add(k,n){var d=parse(k);d.setDate(d.getDate()+n);return dk(d)}
function f5diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}

/* ---------- ١) وضع رمضان ---------- */
function ramInfo(){
  var now=new Date(),h=hijriNumeric(now);if(!h)return null;
  if(h.month===9)return {state:'in',day:h.day,year:h.year,left:Math.max(0,30-h.day)};
  for(var i=1;i<=400;i++){var d=new Date(now.getTime()+i*864e5),x=hijriNumeric(d);if(x&&x.month===9&&x.day===1)return {state:h.month>9?'after':'before',days:i,year:x.year,date:d}}
  return {state:'before',days:null,year:h.year};
}
function ramGet(y,d){S.ram=S.ram&&typeof S.ram==='object'?S.ram:{};var Y=S.ram[y]=S.ram[y]||{};return Y[d]=Y[d]||{}}
var RAM_TASKS=[['sawm','صمتُ اليوم'],['tar','التراويح'],['qiyam','قيام الليل'],['quran','وردي من القرآن'],['sadaqa','صدقة'],['dua','دعاء عند الإفطار']];

    days.forEach(function(k){RAM_TASKS.forEach(function(x){if(S.ram[I.year][k][x[0]])tot++})});

     +(t?'<section class="card rm5-times"><div><small>السحور ينتهي (الفجر)</small><b>'+ptFmt(t.fajr)+'</b></div><div><small>الإفطار (المغرب)</small><b>'+ptFmt(t.maghrib)+'</b></div></section>':'<section class="card"><p class="note">حدّد موقعك من صفحة الصلوات لتظهر لك أوقات السحور والإفطار.</p></section>')
     +'<section class="card"><h3>عبادات اليوم <span class="rm5-c" id="rm5-c">'+ar(dn)+'/'+ar(RAM_TASKS.length)+'</span></h3>'
     +RAM_TASKS.map(function(x){var on=!!rec[x[0]];return '<button class="rm5-t'+(on?' on':'')+'" data-a="ramtog" data-v="'+x[0]+'" aria-pressed="'+on+'"><i>'+(on?'✓':'')+'</i><span>'+x[1]+'</span></button>'}).join('')
     +'</section><section class="card"><p class="note" style="margin:0">مجموع ما أنجزته في هذا الشهر: <b>'+ar(tot)+'</b> عبادة</p></section>';
