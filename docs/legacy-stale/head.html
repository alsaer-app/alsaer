<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://bayan.alwa7i.com https://api.hadith.gading.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="أحمد العجمي">
<meta name="theme-color" content="#061d1a">
<title>السائر إلى الله</title>
<style>
:root{
  --bg:#061a17; --bg2:#0a2621; --surface:#0d2a25; --surface-2:#133630; --fg:#eef4ee; --muted:#9db5ab; --line:#1f4a3f;
  --gold:#dcb871; --gold-2:#b98d3f; --gold-soft:#2f3a22; --on-gold:#1b2418;
  --primary:var(--gold); --on-primary:var(--on-gold);
  --good:#46b48a; --bad:#d0706a; --shadow:0 8px 26px rgba(0,0,0,.28);
  --btn1:#ecd08c; --btn2:#c79a49;
  --font-ui:'Tajawal','Noto Sans Arabic','Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;
  --font-text:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef2ea; --bg2:#e3ebe2; --surface:#ffffff; --surface-2:#eaf0e8; --fg:#16312a; --muted:#62786e; --line:#d3dfd2;
  --gold:#9a7226; --gold-2:#7d5b17; --gold-soft:#f3ead6; --on-gold:#ffffff;
  --good:#23805a; --bad:#b64f4a; --shadow:0 6px 20px rgba(22,49,42,.08);
  --btn1:#2f7d68; --btn2:#1d6654; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 62%) fixed;color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.6;direction:rtl;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) 96px max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0}
h2{font-size:21px;font-weight:800;margin:14px 0 6px}
h3{font-size:16px;font-weight:700;margin:0 0 10px}
p{margin:0 0 10px}
small,.muted{color:var(--muted)}
.gold{color:var(--gold)}
.serif{font-family:var(--font-text)}

/* top bar for sub pages */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 0 12px;max-width:560px;margin:0 auto;background:linear-gradient(var(--bg) 70%,transparent)}
.top h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.top h1 svg.i{color:var(--gold)}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ib.gold{color:var(--gold)}

/* cards */
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--surface-2) 55%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow);position:relative}
.card.flat{box-shadow:none}
.scene{position:relative;border-radius:22px;overflow:hidden;height:152px;margin:4px 0 12px;border:1px solid var(--line);background:#07211d}
.scene svg{display:block;width:100%;height:100%}
.pillday{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(4,20,17,.78);border:1px solid rgba(220,184,113,.25);color:#eef4ee;border-radius:14px;padding:3px 18px;font-size:14px;backdrop-filter:blur(6px);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:15px;padding:12px 18px;min-height:48px;font:inherit;font-weight:800;
  background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold);cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35);text-decoration:none}
.btn.good{background:linear-gradient(180deg,#4fc29a,#2f8f6e);color:#fff}
.btn.bad{background:linear-gradient(180deg,#d9807a,#b0524d);color:#fff}
.btn.ghost{background:color-mix(in srgb,var(--surface-2) 80%,transparent);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.btn:active,.ib:active,.tile:active,.tab:active,.lrow:active{transform:scale(.98)}
.btn:focus-visible,.tab:focus-visible,.day:focus-visible,.chip:focus-visible,.ib:focus-visible,.icon:focus-visible,.tile:focus-visible,.lrow:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.icon{background:transparent;border:0;color:var(--fg);padding:6px 10px;cursor:pointer;display:grid;place-items:center;font:inherit;font-size:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1 1 120px}
.between{justify-content:space-between;flex-wrap:nowrap}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}

/* inputs */
textarea,input[type=text],input[type=password],input[type=number]{width:100%;background:color-mix(in srgb,var(--surface-2) 80%,transparent);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;min-width:0}
textarea{min-height:76px;resize:vertical;margin-bottom:10px}
textarea:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px}
.tmw{position:relative;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;cursor:pointer;min-height:34px;padding:0 4px}.tmw svg.i{width:16px;height:16px}.tmw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

/* splash */
.splash{position:fixed;inset:0;z-index:100;background:#04100e;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 24px calc(54px + env(safe-area-inset-bottom,0px));animation:fade .5s ease}
.splash .bgsvg{position:absolute;inset:0;width:100%;height:100%}
.splash .t{position:relative;font-family:var(--font-text);font-size:50px;font-weight:700;color:#e8c883;line-height:1.3;text-shadow:0 4px 22px rgba(220,184,113,.35)}
.splash .s{position:relative;color:#d6e3dc;font-size:17px;margin:4px 0 26px;line-height:1.7}
.splash .ld{position:relative;width:min(240px,60%);height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.splash .ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ccfb7,#dcb871);border-radius:4px;animation:load 1.7s ease forwards}
@keyframes load{to{width:100%}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* onboarding */
.obh{text-align:center;margin:26px 0 6px}
.obh h2{font-size:30px;margin:0 0 6px}
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.gc{border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-2),var(--surface));border-radius:20px;padding:20px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--fg);font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.gc svg{width:84px;height:84px}
.gc.on{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 50%,transparent),var(--shadow)}
.hero-scene{height:190px;border-radius:0 0 26px 26px;overflow:hidden;margin:0 -16px;position:relative}
.hero-scene svg{width:100%;height:100%;display:block}

/* home */
.greet{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 0 4px}
.greet small{display:block;font-size:14px}
.greet .nm{font-family:var(--font-text);font-size:22px;color:var(--gold);font-weight:700;line-height:1.4}
.greet h1{font-size:27px;font-weight:800;display:flex;align-items:center;gap:8px;line-height:1.3}
.greet h1 svg.i{color:var(--good);width:26px;height:26px}
.banner{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);padding:18px 16px;margin:12px 0;min-height:112px;
  background:linear-gradient(120deg,#0e3a30 0%,#0a2a26 60%,#0c3b3a 100%);color:#eef4ee}
:root[data-theme="light"] .banner{background:linear-gradient(120deg,#1d6654,#2f8a72);}
.banner svg.deco{position:absolute;left:-6px;bottom:-6px;width:150px;height:110px;opacity:.55}
.banner h3{font-size:20px;color:#f0f5ee;margin:0 0 6px;position:relative}
.banner p{font-size:14px;color:#cfe0d8;margin:0;position:relative;line-height:1.8;max-width:78%;font-family:var(--font-text);font-size:16px}
.banner small{position:relative;color:#b7cfc5;display:block;margin-top:2px}
.dprog b{font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:color-mix(in srgb,var(--surface-2) 90%,#000);overflow:hidden;margin-top:8px}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#5fc9a9,var(--gold))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-2),var(--surface));border-radius:20px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
.tile svg.i{width:36px;height:36px;color:var(--gold);stroke-width:1.5}
.tile small{font-size:12px;font-weight:500}
.sect{font-size:17px;font-weight:800;margin:20px 0 4px;display:flex;align-items:center;gap:8px}
.sect svg.i{color:var(--gold)}

/* ring / stats */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 14px 16px;overflow:hidden}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:color-mix(in srgb,var(--surface-2) 90%,#000)}.ring .pg{stroke:var(--gold);transition:stroke-dashoffset .6s ease}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.count{font-size:46px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.ring .mid small{font-size:13px}
.next{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;margin-top:6px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.wk i{width:100%;max-width:34px;aspect-ratio:1;border-radius:11px;background:color-mix(in srgb,var(--surface-2) 85%,transparent);border:1px solid var(--line);display:grid;place-items:center}
.wk i svg{width:15px;height:15px}
.wk.success i{background:var(--good);border-color:var(--good);color:#fff}
.wk.relapse i{background:var(--bad);border-color:var(--bad);color:#fff}
.wk.today span{color:var(--gold)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat small{font-size:12px;font-weight:600}
.stat.g b{color:var(--good)}.stat.r b{color:var(--bad)}.stat.o b{color:var(--gold)}

.quote{border-right:3px solid var(--gold)}
.quote p,.ar{font-family:var(--font-text);font-size:21px;line-height:2;margin:0 0 8px}
.quote small,.ar+small{display:block}
.tipc{border-right:3px solid var(--good)}
.sos{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#a94d4b,#cf726c);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;margin:14px 0;box-shadow:0 8px 20px rgba(169,77,75,.25)}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tg button,.chip{border:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 80%,transparent);color:var(--fg);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tg button.on,.chip.on{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold);border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;font-size:15px}
.chip input{width:auto;margin-left:6px}

/* checklist (prayers & habits) */
.cl{display:flex;flex-direction:column;gap:10px}
.cli{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px;width:100%;color:var(--fg);font:inherit;text-align:right}
button.cli{cursor:pointer}
.cli .nm{flex:1;font-size:17px;font-weight:700}
.cli .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:transparent}
.cli.sq .ck{border-radius:8px}
.cli.on .ck{background:var(--good);border-color:var(--good);color:#fff}
.cli .ck svg{width:16px;height:16px;stroke-width:3}
.cli.on .nm{color:var(--fg)}
.cli .tm{color:var(--muted);font-size:13px}
.cli .x{background:transparent;border:0;color:var(--muted);padding:4px;cursor:pointer;display:grid;place-items:center}
.cli .x svg{width:18px;height:18px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addbtn{width:100%;margin-top:12px;border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold);border-radius:15px;padding:13px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.rateline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rateline b{font-size:26px;color:var(--good)}

/* quran */
.qhero{position:relative;border-radius:22px;overflow:hidden;height:150px;border:1px solid var(--line);margin:4px 0 12px;background:#07211d}
.qhero svg{width:100%;height:100%;display:block}
.step{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 12px}
.step b{font-size:34px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.step .ib{width:46px;height:46px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0}
.wd{text-align:center;color:var(--muted);font-size:12px}
.day{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--fg);font:inherit;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.day.success{background:var(--good);color:#fff;border-color:var(--good)}.day.relapse{background:var(--bad);color:#fff;border-color:var(--bad)}
.day.today{outline:2px solid var(--gold);outline-offset:1px;background:color-mix(in srgb,var(--gold) 80%,transparent);color:var(--on-gold);border-color:var(--gold)}
.legend{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 0 0 5px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mhead h2{margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border:1px solid var(--line);border-radius:16px;padding:5px;margin:6px 0 14px}
.seg button{border:0;border-radius:12px;padding:9px;font:inherit;font-weight:700;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold)}
.bigring{position:relative;width:190px;height:190px;margin:8px auto 14px}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigring .mid b{font-size:42px;font-weight:800;line-height:1.1}
.cheer{display:flex;align-items:center;gap:12px}
.cheer svg.i{color:var(--good);width:28px;height:28px}
.cheer b{font-size:19px;color:var(--gold);display:block}

/* list rows (more / settings / developer) */
.lrows{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.lrow{display:flex;align-items:center;gap:14px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:58px;color:var(--fg);font:inherit;text-align:right;width:100%;cursor:pointer;text-decoration:none}
.lrow svg.i{color:var(--gold)}
.lrow .t{flex:1;font-size:17px;font-weight:700;line-height:1.4}
.lrow .t small{display:block;font-weight:400;font-size:12px}
.lrow .chev{color:var(--muted);width:18px;height:18px}
.sw{position:relative;width:52px;height:30px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#cdd9d3;transition:transform .2s}
.sw.on{background:var(--good);border-color:var(--good)}
.sw.on::after{transform:translateX(-22px);background:#fff}
.devc{text-align:center;padding:22px 16px}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;border:2px solid var(--gold);background:radial-gradient(circle,var(--surface-2),var(--surface));color:var(--gold);font-family:var(--font-text);font-size:46px;font-weight:700;box-shadow:0 0 28px color-mix(in srgb,var(--gold) 22%,transparent)}
.chipv{display:inline-block;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);border-radius:12px;padding:2px 12px;font-size:13px;font-weight:700}

/* achievements & others */
ol{padding-right:22px;line-height:2;margin:0 0 12px}
ul{padding:0;margin:0 0 10px;list-style:none}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.8;border-bottom:1px solid var(--line);padding:4px 0}
.tips li{display:list-item;list-style:disc;margin-right:18px;border:0;padding:3px 0}
.timer{font-size:52px;text-align:center;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;margin:6px 0}
.counter{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-size:20px;font-weight:800;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--on-gold);cursor:pointer;font-variant-numeric:tabular-nums}
.dhikr.done{opacity:.6}
.sum{display:flex;align-items:center;gap:14px}
.sum b{font-size:34px;font-variant-numeric:tabular-nums}
.rank{display:inline-block;background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);border-radius:10px;padding:2px 10px;font-weight:700;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.bd .hex{width:56px;height:62px;display:grid;place-items:center;position:relative;color:var(--muted)}
.bd .hex svg.h{position:absolute;inset:0;width:100%;height:100%;fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.bd .hex span{position:relative;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.bd .hex svg.i{position:relative}
.bd b{font-size:14px;line-height:1.3}.bd small{font-size:12px;line-height:1.35}
.bd.got{background:var(--gold-soft);border-color:var(--gold)}
.bd.got .hex{color:var(--gold)}.bd.got .hex svg.h{stroke:var(--gold)}
.bd .bar{width:100%;height:5px;margin-top:4px}
.ins{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.ins>span:first-child{width:92px;flex:none}
.ins .bar{flex:1;margin:0}
.ins b{width:34px;text-align:left;font-variant-numeric:tabular-nums}
.lock{min-height:80vh;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.lock input{max-width:220px;text-align:center;font-size:24px}
.msg{text-align:center;color:var(--muted);min-height:1.5em}
.note{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 10px}
.copy{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 8px;line-height:1.7;opacity:.8}

.mp:not(.notj) .t0{color:var(--t0)}.mp:not(.notj) .t1{color:var(--t1)}.mp:not(.notj) .t2{color:var(--t2)}.mp:not(.notj) .t3{color:var(--t3)}.mp:not(.notj) .t4{color:var(--t4)}.mp:not(.notj) .t5{color:var(--t5)}

/* mushaf reader */

.sidx{display:flex;flex-direction:column;max-height:380px;overflow-y:auto;margin:0 -6px}
.srow{display:flex;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 6px;color:var(--fg);font:inherit;text-align:right;cursor:pointer}

:root{
  --font-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --bg:#061A1D;--bg2:#061A1D;--surface:#0D252A;--surface-2:#143238;--fg:#E2F3F2;--muted:#8DB1B1;--line:rgba(226,243,242,.10);
  --brand:var(--ac-d,#0E8A86);--brand-2:var(--ac2-d,#0A4A51);--brand-ink:#fff;
  --gold:var(--ac-g,#5FCFC1);--gold-2:var(--ac-d,#0FB3A6);--on-gold:#fff;--btn1:var(--ac-d,#0E8A86);--btn2:var(--ac-d,#0E8A86);
  --good:#3CC487;--warn:#E5A93A;--bad:#EE6B55;
  --card-a:var(--surface);--card-b:var(--surface);--edge:transparent;--glow:transparent;--ico:var(--ac-g,#5FCFC1);--nav:var(--surface);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --r-card:20px;--r-hero:26px;
}
:root[data-theme="light"]{
  --bg:#EEF6F6;--bg2:#EEF6F6;--surface:#FFFFFF;--surface-2:#E0EEEE;--fg:#0E2528;--muted:#53706F;--line:rgba(14,37,40,.10);
  --brand:var(--ac-l,#017D84);--brand-2:var(--ac2-l,#00535F);--gold:var(--ac-l,#017D84);--gold-2:var(--ac-l,#0FB3A6);--ico:var(--ac-l,#017D84);--btn1:var(--ac-l,#017D84);--btn2:var(--ac-l,#017D84);
  --good:#1F8A5B;--warn:#C98A0B;--bad:#C2412D;--shadow:0 1px 2px rgba(14,37,40,.06),0 8px 24px rgba(14,37,40,.06);
}
html{background:var(--bg)}
body{font-family:var(--font-ui);background:radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,var(--brand) 9%,transparent) 0%,transparent 60%) no-repeat,var(--bg);background-size:100% 520px;background-attachment:scroll;padding-bottom:104px}
button,input,textarea,select{font-family:inherit}
.card,.tile,.stat,.cli,.lrow,.gc,.bd,.astat,.seg{background:var(--surface);border:0;box-shadow:var(--shadow)}
.card{border-radius:var(--r-card)}
.card.flat{box-shadow:none}
.seg{background:var(--surface-2);box-shadow:none}
.btn.ghost{border:1px solid var(--line);background:transparent}
:root[data-theme="light"] .card,:root[data-theme="light"] .tile,:root[data-theme="light"] .stat,:root[data-theme="light"] .cli,:root[data-theme="light"] .lrow,:root[data-theme="light"] .bd,:root[data-theme="light"] .astat{box-shadow:var(--shadow)}

/* press / transitions (same easing as the reference) */
button,.tile,.lrow,.cli,.bd,.day{transition:transform .15s cubic-bezier(.3,.7,.4,1.4),background-color .2s,box-shadow .2s,border-color .2s,color .2s}
@keyframes press{0%{transform:scale(1)}30%{transform:scale(.9)}65%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes viewIn{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
@keyframes wave{0%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.pressed{animation:press .3s cubic-bezier(.3,.7,.4,1.3)}
.vin{animation:viewIn .22s ease-out both}
@media (prefers-reduced-motion:reduce){.vin,.pressed,.tab.pressed .pill{animation:none!important}}

/* top bar of inner pages */
.top{padding:12px 0 10px;background:transparent}
.top h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;gap:10px}
.top h1 svg.i{width:26px;height:26px;color:var(--brand);stroke-width:1.8;filter:none}
.top .ib{border:0;background:var(--surface-2);box-shadow:none;width:38px;height:38px;border-radius:11px}
.top .ib svg.i{width:18px;height:18px;stroke-width:2.2}

/* bottom navigation: full-width, pill on active */
.tabbar{left:0;right:0;transform:none;width:auto;max-width:none;bottom:0;padding:0 0 env(safe-area-inset-bottom,0px);border:0;border-top:1px solid var(--line);border-radius:0;background:var(--surface);box-shadow:none;display:flex}
.tabbar[hidden]{display:none!important}
.tab{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.86rem;font-weight:500}
.tab .pill{padding:3px 18px;border-radius:999px;display:grid;place-items:center;transition:background .2s;width:auto;background:transparent!important}
.tab svg.i{width:24px;height:24px;stroke-width:1.8}
.tab.on{color:var(--brand);font-weight:700}
:root:not([data-theme="light"]) .tab.on{color:var(--gold)}
.tab.on .pill{background:color-mix(in srgb,var(--brand) 16%,transparent)!important}
.tab.on svg.i{filter:none}
.tab.pressed{animation:none}.tab.pressed .pill{animation:press .3s cubic-bezier(.3,.7,.4,1.3)}
.tab:focus{outline:none}
.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px));border-radius:14px}

/* home header */
.gh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:8px 0 4px}
.gh .tx small{display:block;font-size:.9rem;color:var(--muted);margin-bottom:2px}
.gh .nmrow{display:flex;align-items:center;gap:12px}
.gh .gname{font-size:1.5rem;font-weight:700;color:var(--fg);text-shadow:none}
.avt{width:46px;height:46px;border-radius:50%;border:0;background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand);padding:0;overflow:hidden;cursor:pointer;box-shadow:none;flex:none}
.avt svg{width:100%;height:100%;display:block}
.gh h1{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-top:4px;line-height:1.3}
.gh h1 svg.i{width:28px;height:28px;color:var(--brand);stroke-width:1.8;filter:none;animation:wave 1.6s ease .3s 1;transform-origin:70% 70%}
.gtools{display:flex;gap:8px}
.bell{position:relative;width:42px;height:42px;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);color:var(--ink,var(--fg));display:grid;place-items:center;cursor:pointer;padding:0}
.bell svg.i{width:22px;height:22px;stroke-width:1.8;filter:none;color:var(--fg)}
.bell.eye{color:var(--fg)}.bell.eye svg.i{width:22px;height:22px;filter:none}
.bell i{position:absolute;top:7px;left:9px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

/* hero banner = the reference hero card */
.banner{position:relative;overflow:hidden;border-radius:var(--r-hero);border:0;min-height:122px;padding:20px 20px 18px;color:#fff;
  background:repeating-radial-gradient(circle at 12% 120%,rgba(255,255,255,.06) 0 1px,transparent 1px 9px),linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  box-shadow:0 18px 36px -18px color-mix(in srgb,var(--brand) 75%,transparent)}
.banner::after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.18);border-radius:14px;pointer-events:none}
.banner h3{font-size:1.3rem;font-weight:700;color:#fff}
.banner p{max-width:100%;font-size:.98rem;line-height:1.8;color:rgba(255,255,255,.88)}
.banner svg.deco{left:0;bottom:0;width:170px;height:110px;opacity:.55}
.dprog{padding:14px 16px}
.dprog .bar{height:14px;margin-top:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.dprog .bar>div{background:linear-gradient(270deg,#A6FBEB,#7DF4E2);border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
:root[data-theme="light"] .dprog .bar>div{background:linear-gradient(270deg,#0FB3A6,#017D84)}

.tile small{color:var(--muted);font-size:.78rem;font-weight:500}
.sect{font-weight:700}.sect svg.i{filter:none;color:var(--brand)}
:root:not([data-theme="light"]) .sect svg.i{color:var(--gold)}

/* checklists */
.cli{border-radius:18px;padding:12px 14px;min-height:58px}
.cli .nm{font-size:1rem;font-weight:600}
.cli .ck{width:28px;height:28px}
.cli.sq .ck{border-radius:9px}
.cli .tm,.tmw{font-weight:500}
.tmw{color:var(--muted);font-size:.9rem}.tmw svg.i{color:var(--muted)}
.addbtn{border-radius:14px;font-size:1rem;box-shadow:none}

/* settings / lists */
.lrow{border-radius:18px;padding:14px 16px;min-height:58px}
.lrow svg.i{color:var(--brand);width:22px;height:22px}
:root:not([data-theme="light"]) .lrow svg.i{color:var(--gold)}
.lrow .t{font-size:1rem;font-weight:600}
.lrow .chev{color:var(--muted);width:18px;height:18px;stroke-width:2.2}
.lrow .val{color:var(--muted);font-size:.9rem;font-weight:500;white-space:nowrap}
.panel{margin:-2px 6px 6px}
.panel .card{margin:6px 0}

/* calendar */
.wd{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden}
.day{border-color:var(--line)}
.day.today{box-shadow:0 0 0 2px var(--brand)}
.mhead{border:0;border-radius:14px;padding:6px 8px;background:var(--surface-2)}

.astats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.astat{padding:14px 8px;text-align:center;border-radius:20px}
.astat small{font-size:.9rem;font-weight:500;color:var(--muted);display:block}
.astat b{font-size:1.9rem;font-weight:700;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.badges{gap:12px}
.bd{border-radius:20px;padding:16px 8px 12px;gap:8px}
.bd .bi{position:relative;width:56px;height:56px;display:grid;place-items:center;color:var(--brand)}
:root:not([data-theme="light"]) .bd .bi{color:var(--gold)}
.bd .bi svg.i{width:54px;height:54px;stroke-width:1.3;filter:none}
.bd .bi span{position:absolute;top:11px;left:0;right:0;text-align:center;font-weight:700;font-size:16px;color:var(--brand);line-height:1.2}
:root:not([data-theme="light"]) .bd .bi span{color:var(--gold)}
.bd .bi span.s3{font-size:12px;top:13px}
.bd:not(.got) .bi{opacity:.4}
.bd b{font-size:.98rem;line-height:1.35}
.bd small{color:var(--muted)}
.bd.got{background:var(--surface);border:0}
.bd .okc{color:var(--good);display:grid;place-items:center}.bd .okc svg.i{width:26px;height:26px;stroke-width:3}

/* reminders (in-app) */
.rem{display:flex;gap:14px;align-items:flex-start}
.rem .ri{color:var(--brand);flex:none}.rem .ri svg.i{width:30px;height:30px;stroke-width:1.6}
.rem h4{margin:0 0 4px;font-size:1.05rem;font-weight:700}
.rem .acts{display:flex;gap:10px;margin-top:12px}
.rem .acts .btn{flex:1;min-height:44px;border-radius:14px;padding:8px 12px;font-size:.95rem}

/* splash (reference: tile rises, word writes itself) */
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spWrite{to{clip-path:inset(0 0 0 0)}}
.splash{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0}
.splash .sp-tile{width:96px;height:96px;border-radius:27px;position:relative;overflow:hidden;background:linear-gradient(135deg,#12E3D2 0%,#02A5A4 50%,#00535F 100%);box-shadow:0 14px 30px -12px rgba(0,83,95,.55);opacity:0;transform:translateY(46px) scale(.88);animation:spUp .46s cubic-bezier(.2,.9,.25,1.15) forwards;display:grid;place-items:center}
.splash .sp-tile svg{width:64px;height:64px}
.splash .t{font-family:var(--font-ui);font-weight:700;font-size:2rem;line-height:1.2;color:var(--fg);white-space:nowrap;clip-path:inset(0 0 0 100%);animation:spWrite .42s .28s cubic-bezier(.45,0,.2,1) forwards;background:none;-webkit-background-clip:border-box;filter:none}
.splash .s{color:var(--muted);font-size:.95rem;font-weight:500;text-align:center;opacity:0;animation:spUp .4s .6s ease forwards;transform:translateY(6px)}
.splash .ld{height:5px;background:var(--surface-2);width:min(200px,56%);border-radius:999px;overflow:hidden}
.splash .ld i{background:linear-gradient(90deg,#7DF4E2,#A6FBEB)}
.splash .ver{display:none}
.gc{border-radius:20px}
.chipv{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.avatar{box-shadow:none}
@media(max-width:380px){.splash .t{font-size:1.7rem}.tile{font-size:.92rem}.gh h1{font-size:1.3rem}.top h1{font-size:1.3rem}}

/* quran reader controls */
.rbar{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--line)}
.rbar .ib{border-radius:14px;background:var(--surface-2);border:0}
.mp{box-shadow:var(--shadow);border:0}
:root{--pg-a:#0F2F33;--pg-b:#0B2428}
:root[data-theme="light"]{--pg-a:#FFFFFF;--pg-b:#F4FAFA}

/* ---- palette styles ---- */
:root[data-style="midnight"][data-theme="dark"]{--bg:#000;--surface:#0E0E11;--surface-2:#1A1A1F;--fg:#F2F2F5;--muted:#9A9AA5;--line:rgba(255,255,255,.12);--shadow:0 0 0 1px rgba(255,255,255,.05)}
:root[data-style="royal"][data-theme="dark"]{--bg:#0A1020;--surface:#121A2E;--surface-2:#1B2540;--fg:#EDE6D3;--muted:#9AA3B8;--line:rgba(212,175,55,.20);--shadow:0 1px 2px rgba(0,0,0,.4)}
:root[data-style="paper"][data-theme="light"]{--bg:#F6F1E7;--surface:#FFFBF3;--surface-2:#EDE5D6;--fg:#2B2118;--muted:#7A6A58;--line:rgba(43,33,24,.12);--shadow:0 1px 2px rgba(43,33,24,.06),0 8px 24px rgba(43,33,24,.06);--pg-a:#FFFDF6;--pg-b:#F7F1DD}
:root[data-style="paper"][data-theme="dark"]{--bg:#17130E;--surface:#221C15;--surface-2:#2E261D;--fg:#EFE6D6;--muted:#A8998A;--line:rgba(239,230,214,.12)}
:root[data-style="ocean"][data-theme="light"]{--bg:#EAF3F8;--surface:#FFFFFF;--surface-2:#DCEAF2;--fg:#0B2A3C;--muted:#52707F;--line:rgba(11,42,60,.10)}
:root[data-style="ocean"][data-theme="dark"]{--bg:#07141D;--surface:#0E2230;--surface-2:#153042;--fg:#E4F0F6;--muted:#8FAEBD;--line:rgba(228,240,246,.12)}


:root[data-theme="light"] .banner{background:repeating-radial-gradient(circle at 12% 120%,rgba(255,255,255,.06) 0 1px,transparent 1px 9px),linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%)}
:root[data-look="flat"] .banner,:root[data-theme="light"][data-look="flat"] .banner{background:var(--brand)}
/* ---- looks ---- */
:root[data-look="flat"]{--shadow:none;--r-card:12px;--r-hero:16px}
:root[data-look="flat"] body{background:var(--bg)}
[data-look="flat"] .card,[data-look="flat"] .tile,[data-look="flat"] .lrow,[data-look="flat"] .cli,[data-look="flat"] .bd,[data-look="flat"] .astat,[data-look="flat"] .bell{box-shadow:none;border:1px solid var(--line)}
[data-look="flat"] .banner{background:var(--brand);box-shadow:none}[data-look="flat"] .banner::after{display:none}
[data-look="flat"] .tile,[data-look="flat"] .lrow,[data-look="flat"] .cli{border-radius:12px}
[data-look="compact"] #app,[data-look="compact"] #top{zoom:.92}
[data-look="compact"] .card{padding:12px;margin-bottom:10px}[data-look="compact"] .banner{padding:14px 16px 12px;min-height:0}
[data-look="comfy"] #app,[data-look="comfy"] #top{zoom:1.08}
[data-look="comfy"] .btn{min-height:56px}
:root[data-look="soft"]{--r-card:28px;--r-hero:32px}
[data-look="soft"] .tile,[data-look="soft"] .lrow,[data-look="soft"] .cli,[data-look="soft"] .bd,[data-look="soft"] .astat{border-radius:26px}
[data-look="soft"] .btn,[data-look="soft"] .seg,[data-look="soft"] .seg button,[data-look="soft"] .addbtn{border-radius:999px}
[data-look="soft"] input,[data-look="soft"] textarea{border-radius:20px}
[data-look="soft"] .tile{background:color-mix(in srgb,var(--brand) 12%,var(--surface))}

/* ---- press / transition variants ---- */
@keyframes pressSoft{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes pressGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}100%{box-shadow:0 0 0 12px color-mix(in srgb,var(--brand) 0%,transparent)}}
@keyframes pressRip{from{transform:scale(0);opacity:.28}to{transform:scale(1);opacity:0}}
[data-press="soft"] .pressed,[data-press="soft"] .tab.pressed .pill{animation:pressSoft .22s ease}
[data-press="glow"] .pressed,[data-press="glow"] .tab.pressed .pill{animation:pressGlow .45s ease-out}
[data-press="ripple"] .pressed,[data-press="ripple"] .tab.pressed .pill{animation:none}
[data-press="none"] .pressed,[data-press="none"] .tab.pressed .pill{animation:none}
[data-press="none"] button{transition:none}
.rp-clip{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:pressRip .45s ease-out forwards;z-index:0}
@keyframes viewSlide{from{opacity:.15;transform:translate3d(-40px,0,0)}to{opacity:1;transform:none}}
@keyframes viewZoom{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes viewFade{from{opacity:0}to{opacity:1}}
[data-trans="slide"] .vin{animation:viewSlide .26s cubic-bezier(.2,.8,.2,1) both}
[data-trans="zoom"] .vin{animation:viewZoom .24s cubic-bezier(.2,.8,.2,1) both}
[data-trans="fade"] .vin{animation:viewFade .2s ease both}
[data-trans="none"] .vin{animation:none}

/* ---- appearance panel ---- */
.ap h3{margin:16px 0 8px;font-size:.95rem;color:var(--muted);font-weight:700}.ap h3:first-child{margin-top:0}
.seg.n3{grid-template-columns:repeat(3,1fr)}
.uo{border:1.5px solid transparent;background:var(--surface-2);color:var(--fg);font:inherit;cursor:pointer;border-radius:14px}
.uo[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.sty-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px}.sty small{font-size:.7rem;line-height:1.2;text-align:center}
.sty .pv{width:100%;max-width:44px;height:44px;border-radius:10px;position:relative;overflow:hidden;display:block}
.sty .pv i{position:absolute;inset:auto 5px 5px 5px;height:16px;border-radius:5px}.sty .pv b{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%}
.acc-row{display:flex;flex-wrap:wrap;gap:10px}
.acc{width:34px;height:34px;border-radius:50%;border:3px solid transparent;color:#fff;font-weight:800;cursor:pointer;display:grid;place-items:center;padding:0}
.acc[aria-pressed="true"]{border-color:var(--fg)}
.look-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px}.lo b{font-size:.72rem;font-weight:600}
.lk-pv{width:100%;max-width:42px;height:36px;border-radius:9px;background:var(--bg);display:flex;flex-direction:column;gap:4px;padding:5px}
.lk-pv i{flex:1;border-radius:4px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.lk-pv.flat i{box-shadow:none;border:1px solid var(--muted);background:transparent;border-radius:3px}.lk-pv.compact{gap:2px;padding:4px}.lk-pv.comfy i{border-radius:8px}.lk-pv.soft i{border-radius:99px;box-shadow:none;background:color-mix(in srgb,var(--brand) 30%,var(--surface))}
.font-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px}.fo .fo-s{font-size:1.4rem;font-weight:700;line-height:1.4}.fo small{font-size:.75rem}
.opt-list{display:flex;flex-direction:column;gap:6px}
.ol{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:10px 14px;text-align:start}.ol small{color:var(--muted);font-size:.8rem}

/* ---- LTR (English) adjustments ---- */
html[dir="ltr"] body{direction:ltr}
html[dir="ltr"] .mp,html[dir="ltr"] .rbar{direction:rtl}
html[dir="ltr"] .lrow .chev{transform:scaleX(-1)}
html[dir="ltr"] .top{flex-direction:row-reverse}
html[dir="ltr"] .tabbar{flex-direction:row-reverse}
html[dir="ltr"] .lrow,html[dir="ltr"] .cli,html[dir="ltr"] .card,html[dir="ltr"] .banner,html[dir="ltr"] .tile{text-align:start}
html[dir="ltr"] input,html[dir="ltr"] textarea{direction:ltr;text-align:left}
html[dir="ltr"] .ar{direction:rtl;text-align:right}
html[dir="ltr"] .mhead{flex-direction:row-reverse}
html[dir="ltr"] .wd{font-size:9px}

/* Personalized profile and time-aware greeting */
.welcome-line{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;margin:0 0 9px;color:var(--gold)}
.welcome-line svg.i{width:25px;height:25px}
.welcome-line.is-morning svg.i{color:#e8bd63;filter:drop-shadow(0 0 7px rgba(232,189,99,.35))}
.welcome-line.is-evening svg.i{color:#b8c8e8;filter:drop-shadow(0 0 7px rgba(184,200,232,.35))}
.profile-avt{overflow:hidden;display:grid;place-items:center}
.profile-photo{display:block;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:var(--surface-2)}
.profile-edit-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.profile-edit-head .profile-photo{width:76px;height:76px;flex:none}
.profile-label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px;color:var(--fg)}
.profile-file{padding:10px!important;font-size:13px!important}

/* Dual Gregorian and Hijri calendar strip */
.calendar-line{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:1px 0 10px;color:var(--muted);font-size:12px;font-weight:700}
.calendar-line>span{display:inline-flex;align-items:center;gap:4px}
.calendar-line svg.i{width:15px;height:15px;color:var(--gold)}
.calendar-line .cal-sep{opacity:.55}

/* Fasting planner and private habit tracker */
.fasting-hero{background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--gold) 18%,var(--surface)),var(--surface));text-align:center}
.fasting-icon{width:54px;height:54px;margin:0 auto 8px;border-radius:18px;display:grid;place-items:center;color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.fasting-icon svg.i{width:30px;height:30px}
.fasting-today{display:flex;flex-direction:column;gap:3px;padding:12px;margin:14px 0;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface-2) 75%,transparent)}
.fasting-today span{color:var(--gold);font-weight:800}
.fast-options{display:flex;flex-direction:column;gap:8px}
.fast-option{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--fg);font:inherit;text-align:right;width:100%;margin:7px 0}
button.fast-option{cursor:pointer}
.fast-option>span:nth-child(2),.fast-option>span:first-child{display:flex;flex-direction:column;gap:2px;flex:1}
.fast-option small{font-size:12px;color:var(--muted)}
.fast-option.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.fast-check{width:25px;height:25px;flex:none;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--gold)}
.fast-check svg.i{width:16px;height:16px}
.fast-next{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fast-next:last-of-type{border-bottom:0}
.fast-next>div{display:flex;flex-direction:column;min-width:100px}
.fast-next small{font-size:11px;color:var(--muted)}
.fast-next>span{font-size:13px;color:var(--gold);text-align:left}
.toggle{border:1px solid var(--line);border-radius:20px;padding:7px 12px;background:var(--surface);color:var(--muted);font:inherit;font-size:12px;white-space:nowrap}
.toggle.on{background:color-mix(in srgb,var(--good) 15%,var(--surface));border-color:var(--good);color:var(--good)}
.habits-summary .bar{margin:10px 0}
.bad-sect{color:var(--bad)}
.bad-habit{border-color:color-mix(in srgb,var(--bad) 28%,var(--line))}
.habit-count{min-width:28px;text-align:center;font-weight:900;color:var(--bad);font-size:18px;font-variant-numeric:tabular-nums}
.count-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.count-btn.plus{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.fast-alert{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}

/* Worship dashboard and refined profile */
.profile-hero{padding:16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--gold) 12%,var(--surface)),var(--surface));margin:4px 0 12px;box-shadow:var(--shadow)}
.profile-main{display:flex;align-items:center;gap:13px;min-width:0}
.profile-avatar-large{width:78px;height:78px;flex:none;border:2px solid var(--gold);border-radius:25px;padding:3px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));overflow:hidden;display:grid;place-items:center}
.profile-avatar-large .profile-photo{width:68px!important;height:68px!important;border-radius:20px}
.profile-identity{flex:1;min-width:0}.profile-identity h1{font-size:21px;line-height:1.3;font-weight:900;overflow-wrap:anywhere}.profile-identity .welcome-line{font-size:13px;margin:0 0 4px;gap:5px}.profile-identity .welcome-line svg.i{width:17px;height:17px}.profile-sub{font-size:12px;color:var(--muted);margin-top:4px}
.profile-hero .calendar-line{margin:13px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.worship-card{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--gold) 9%,var(--surface)),var(--surface))}
.worship-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.worship-head h2{font-size:23px;margin:0}.eyebrow{font-size:11px;color:var(--gold);font-weight:800}.worship-head .note{margin:2px 0 0}.worship-score{width:68px;height:68px;flex:none;border-radius:22px;background:color-mix(in srgb,var(--gold) 15%,var(--surface-2));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center}.worship-score b{font-size:25px;line-height:1.1;color:var(--gold)}.worship-score small{font-size:10px}.worship-progress{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 10px}.worship-list{display:flex;flex-direction:column;gap:7px}.worship-row{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface-2) 75%,transparent)}.worship-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-width:0}.worship-name svg.i{width:18px;height:18px;color:var(--gold)}.worship-actions{display:flex;gap:5px;flex:none}.worship-choice{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:68px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font:inherit;font-size:11px;font-weight:800}.worship-choice svg.i{width:13px;height:13px}.worship-choice.yes.selected{color:var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}.worship-choice.no.selected{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}.worship-privacy{font-size:11px;text-align:center;margin:10px 0 0}
.hadith-card{border-color:color-mix(in srgb,var(--gold) 35%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--gold) 8%,var(--surface)),var(--surface))}.hadith-title{display:flex;align-items:center;gap:8px;color:var(--gold);margin-bottom:10px}.hadith-title b{flex:1}.hadith-text{font-family:var(--font-text);font-size:20px;line-height:1.9;text-align:center;margin:4px 0 12px}.hadith-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}.hadith-meta b{color:var(--good)}.hadith-source{display:block;text-align:center;color:var(--gold);font-size:11px;text-decoration:none;margin-top:7px}
@media(max-width:380px){.worship-row{align-items:flex-start;flex-direction:column}.worship-actions{width:100%}.worship-choice{flex:1}.profile-avatar-large{width:68px;height:68px}.profile-avatar-large .profile-photo{width:58px!important;height:58px!important}}


/* Refined home hierarchy: daily reset, animated hadith, and personal identity */
.new-day-card{position:relative;overflow:hidden;margin:4px 0 12px;padding:23px 18px 20px;border-radius:24px;border:1px solid color-mix(in srgb,var(--gold) 34%,var(--line));background:radial-gradient(circle at 12% 0%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 44%),linear-gradient(135deg,color-mix(in srgb,var(--ac-l) 18%,var(--surface)),var(--surface));box-shadow:var(--shadow);isolation:isolate}
.new-day-card:after{content:"";position:absolute;inset:auto -34px -58px auto;width:190px;height:190px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:50%;box-shadow:0 0 0 18px color-mix(in srgb,var(--gold) 5%,transparent),0 0 0 38px color-mix(in srgb,var(--gold) 4%,transparent);z-index:-1}
.new-day-card .new-day-kicker{text-align:center;color:var(--gold);font-size:10px;letter-spacing:2px;font-weight:900;margin-bottom:6px}
.new-day-card h3{text-align:center;font-size:25px;line-height:1.4;font-weight:950;margin:0 0 8px;background:linear-gradient(90deg,var(--fg),var(--gold),var(--fg));background-size:180% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:dayShimmer 7s ease-in-out infinite}
.new-day-card p{text-align:center;font-size:14px;line-height:1.9;margin:0 auto;max-width:36em}
.new-day-card small{display:block;text-align:center;color:var(--gold);margin-top:7px;font-weight:800}
@keyframes dayShimmer{0%,100%{background-position:0% center}50%{background-position:100% center}}
.hadith-reveal{position:relative;overflow:hidden;isolation:isolate;animation:hadithEnter .75s cubic-bezier(.2,.8,.2,1) both;background:linear-gradient(145deg,color-mix(in srgb,var(--gold) 12%,var(--surface)),var(--surface) 68%);border:1px solid color-mix(in srgb,var(--gold) 42%,var(--line));box-shadow:0 12px 34px color-mix(in srgb,var(--gold) 9%,transparent)}
.hadith-reveal:before{content:"";position:absolute;inset:-80% auto auto -20%;width:170px;height:170px;border-radius:50%;background:color-mix(in srgb,var(--gold) 10%,transparent);filter:blur(8px);animation:hadithGlow 5s ease-in-out infinite;z-index:-1}
.hadith-orbit{position:absolute;top:12px;inset-inline-end:14px;width:28px;height:28px;color:var(--gold);pointer-events:none;opacity:.85}
.hadith-orbit span{position:absolute;inset:2px;display:grid;place-items:center;font-size:19px;animation:starPulse 2.8s ease-in-out infinite}
.hadith-orbit i{position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:50%;animation:orbitPulse 3.2s ease-out infinite}
.hadith-reveal .hadith-title{padding-inline-end:32px}
.hadith-reveal .hadith-text{animation:hadithTextIn 1s .12s both;text-wrap:pretty}
.hadith-reveal .hadith-meta,.hadith-reveal .hadith-source{animation:hadithTextIn .8s .28s both}
@keyframes hadithEnter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes hadithTextIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes hadithGlow{0%,100%{transform:translate(0,0) scale(.85);opacity:.45}50%{transform:translate(28px,18px) scale(1.3);opacity:.9}}
@keyframes starPulse{0%,100%{transform:scale(.82) rotate(-10deg);opacity:.65}50%{transform:scale(1.12) rotate(12deg);opacity:1}}
@keyframes orbitPulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.65);opacity:0}}
.profile-hero{padding:17px;border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--ac-l) 13%,var(--surface)),var(--surface) 72%);border:1px solid color-mix(in srgb,var(--ac-l) 22%,var(--line))}
.profile-avatar-large{border-radius:50%;width:82px;height:82px;padding:3px;box-shadow:0 5px 18px color-mix(in srgb,var(--gold) 17%,transparent)}
.profile-avatar-large .profile-photo{width:72px!important;height:72px!important;border-radius:50%}
.profile-identity h1{font-size:22px;letter-spacing:-.3px}
.profile-identity .welcome-line{font-weight:850;color:var(--gold)}
.age-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--ac-l) 10%,var(--surface-2));border:1px solid var(--line);font-size:11px;font-weight:800}
.profile-preview{padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(130deg,color-mix(in srgb,var(--ac-l) 9%,var(--surface)),var(--surface-2));margin-bottom:14px}
.profile-preview .profile-edit-head{margin:0}
.profile-edit-head{display:flex;align-items:center;gap:14px}
.profile-edit-head .profile-photo{border-radius:22px;object-fit:cover;border:2px solid var(--gold);padding:2px;background:var(--surface)}
.profile-label{display:block;margin:13px 0 6px;font-size:13px;font-weight:850;color:var(--gold)}
.profile-edit input:not([type=file]){min-height:48px;border-radius:14px;padding:12px 14px}
.profile-file{width:100%;border-radius:14px!important;background:var(--surface-2)!important}
.worship-summary .worship-progress{margin:10px 0 12px}
.worship-open{display:flex;align-items:center;justify-content:center;gap:8px}
.worship-open .i{width:17px;height:17px}
@media(prefers-reduced-motion:reduce){.new-day-card h3,.hadith-reveal,.hadith-reveal:before,.hadith-orbit span,.hadith-orbit i,.hadith-reveal .hadith-text,.hadith-reveal .hadith-meta,.hadith-reveal .hadith-source{animation:none!important;transition:none!important}}
@media(max-width:380px){.new-day-card{padding:19px 14px}.new-day-card h3{font-size:22px}.profile-main{gap:10px}.profile-avatar-large{width:70px;height:70px}.profile-avatar-large .profile-photo{width:60px!important;height:60px!important}}
