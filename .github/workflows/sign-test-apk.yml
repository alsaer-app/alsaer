name: Sign test APK (temporary)

# TEMPORARY workflow for agent-built signed test APKs. Artifact upload only:
# never creates tags/GitHub Releases and never touches update.json.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name without the v, e.g. 1.0.14-test'
        required: true
        default: '1.0.14-test'
      code_offset:
        description: 'Added to 10145+run_number for versionCode (avoid downgrade vs earlier test APKs)'
        required: true
        default: '0'

permissions:
  contents: read

jobs:
  sign:
    name: Build and sign test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/alsaer-release-key.p12
          test -s android/app/alsaer-release-key.p12
      - name: Build web bundle
        run: python3 tools/build_web.py
      - name: Install Capacitor deps and sync
        run: |
          npm ci || npm install
          npx @capacitor/cli@5 sync android
      - name: Set test version metadata
        run: |
          CODE=$((10145 + ${{ github.run_number }} + ${{ inputs.code_offset }}))
          python3 - <<PY
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode ' + str($CODE), s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]+"', 'versionName "${{ inputs.version }}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('version bump failed')
          p.write_text(s)
          PY
      - name: Assemble and sign release APK
        working-directory: android
        env:
          ALSAER_KEYSTORE_FILE: alsaer-release-key.p12
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsaer-signed-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Clean up keystore
        if: always()
        run: rm -f android/app/alsaer-release-key.p12
