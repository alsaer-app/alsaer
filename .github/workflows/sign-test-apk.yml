name: Sign test APK (temporary)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: true
        default: 'exp/quranlab-v4'
      expect_version:
        description: 'Expected versionCode'
        required: true
        default: '10188'
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build web and sync native assets
        run: |
          python3 tools/build_web.py
          python3 tools/build_web.py --check
          npm ci
          npx @capacitor/cli@5 sync android
      - name: Decode signing key only inside GitHub
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/alsaer-release-key.p12
          test -s android/app/alsaer-release-key.p12
      - name: Build V4 personal test
        working-directory: android
        env:
          ALSAER_KEYSTORE_FILE: alsaer-release-key.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          QURANLAB_KEY: ${{ secrets.QURANLAB_KEY }}
        run: |
          test -n "$QURANLAB_KEY" || { echo 'QURANLAB_KEY is missing'; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify signed APK and build metadata
        env:
          EXPECT: ${{ inputs.expect_version }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/cert.txt
          grep -q '647b477f5e19a79ec542b70d12476a166f3bf262ae7b5c2b1602bcc58a1c85e0' /tmp/cert.txt
          "$BT/aapt" dump badging "$APK" | head -1 | tee /tmp/metadata.txt
          grep -q "versionCode='${EXPECT}'" /tmp/metadata.txt
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: alsaer-v4diag-signed-test
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/alsaer-release-key.p12
