name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alsaer-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build web bundle (src -> www/index.html)
        run: python3 tools/build_web.py

      - name: Syntax-check the built JS bundle
        run: |
          python3 - <<'EOF'
          import re
          s = open('www/index.html', encoding='utf-8').read()
          js = re.search(r'<script>(.*)</script>', s, re.S).group(1)
          open('/tmp/bundle-check.js', 'w', encoding='utf-8').write(js)
          print('extracted', len(js), 'bytes')
          EOF
          node --check /tmp/bundle-check.js

      - name: Install Capacitor deps and sync
        run: |
          npm ci || npm install
          npx @capacitor/cli@5 sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsaer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
