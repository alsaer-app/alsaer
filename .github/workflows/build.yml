name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alsaer-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build web bundle (src -> www/index.html)
        run: python3 tools/build_web.py

      - name: Syntax-check the built JS bundle
        run: |
          python3 - <<'EOF'
          # Parse www/index.html like a browser: check every inline <script> (no src) separately.
          from html.parser import HTMLParser
          import subprocess, sys
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.cur = None; self.inside = False; self.out = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.inside = True
                      self.cur = None if dict(attrs).get('src') else []
              def handle_data(self, data):
                  if self.inside and self.cur is not None:
                      self.cur.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script':
                      if self.cur is not None:
                          self.out.append(''.join(self.cur))
                      self.cur = None; self.inside = False
          p = P()
          p.feed(open('www/index.html', encoding='utf-8').read())
          if not p.out:
              sys.exit('no inline scripts found in www/index.html')
          bad = 0
          for i, js in enumerate(p.out):
              path = '/tmp/bundle-check-%d.js' % i
              open(path, 'w', encoding='utf-8').write(js)
              r = subprocess.run(['node', '--check', path], capture_output=True, text=True)
              print('script', i, len(js), 'bytes', 'OK' if r.returncode == 0 else 'FAIL')
              if r.returncode != 0:
                  print(r.stderr); bad = 1
          sys.exit(bad)
          EOF

      - name: Run Python regression tests
        run: python3 tests/mushaf_wordmap_regression.py

      - name: Run contract tests (fast, no browser)
        run: |
          set -e
          for t in tests/*_contract.cjs; do echo "== $t"; node "$t"; done
          # These compile Java against local org.json/android jars that CI does not have.
          SKIP=" alarm_dates alarm_request_ids float_overnight_native reminder_plan snooze_channels "
          for t in tests/*_contract.py; do
            n=$(basename "$t" _contract.py)
            case "$SKIP" in *" $n "*) echo "== $t (skipped: needs local Java jars)"; continue;; esac
            echo "== $t"; python3 "$t"
          done

      - name: Install Capacitor deps and sync
        run: |
          npm ci || npm install
          npx @capacitor/cli@5 sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsaer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
