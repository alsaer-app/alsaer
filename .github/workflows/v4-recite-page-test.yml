name: Recite page test 10191 (temporary)
on:
  push:
    branches: [main]
    paths: [.github/workflows/v4-recite-page-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: exp/quranlab-v4, fetch-depth: 0}
      - shell: python
        name: Apply reviewed recite-page patch onto new branch off the test branch only
        run: |
          import base64,lzma,pathlib,subprocess,glob
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='d66524009773c018d2f240d21b2d30971a505bde','stale patch'
          ps=sorted(glob.glob('.github/rpage/rpage-blob-*.txt')); assert len(ps)==6
          pathlib.Path('/tmp/rpage.patch').write_bytes(lzma.decompress(base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in ps))))
          subprocess.run(['git','apply','--check','/tmp/rpage.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/rpage.patch'],check=True)
          subprocess.run(['git','-c','user.name=alsaer-app','-c','user.email=alsaer-app@users.noreply.github.com','commit','-m','feat: recite tab becomes page-scoped mushaf screen (Tarteel-like, stage 1, test 10191)'],check=True)
          subprocess.run(['git','push','--force','origin','HEAD:exp/recite-page'],check=True)
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Build web, sync, mapping regression gate
        run: |
          python3 tools/build_web.py && python3 tools/build_web.py --check
          node --check src/services/recite-asr.js && node --check src/services/recite-page.js
          npm ci && npx @capacitor/cli@5 sync android
          python3 tests/mushaf_wordmap_regression.py
          python3 tests/tf_reference_regression.py && python3 tests/tf_alignment_regression.py && python3 tests/tf_agc_regression.py
      - name: Decode signing key inside GitHub only
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/alsaer-release-key.p12 && test -s android/app/alsaer-release-key.p12
      - name: Build signed V4 personal test
        working-directory: android
        env:
          ALSAER_KEYSTORE_FILE: alsaer-release-key.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          QURANLAB_KEY: ${{ secrets.QURANLAB_KEY }}
        run: test -n "$QURANLAB_KEY" && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Verify signed APK and metadata
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1); APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/cert.txt
          grep -q '647b477f5e19a79ec542b70d12476a166f3bf262ae7b5c2b1602bcc58a1c85e0' /tmp/cert.txt
          "$BT/aapt" dump badging "$APK" | head -1 | tee /tmp/meta.txt
          grep -q "versionCode='10191'" /tmp/meta.txt && grep -q "versionName='1.0.17-test14-rpage'" /tmp/meta.txt
          stat -c '%s bytes' "$APK" && sha256sum "$APK" && git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with: {name: alsaer-rpage-10191-signed-test, path: android/app/build/outputs/apk/release/app-release.apk, retention-days: 3, if-no-files-found: error}
      - if: always()
        name: Remove temporary signing material
        run: rm -f android/app/alsaer-release-key.p12
