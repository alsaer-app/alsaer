name: Signing verification (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-check:
    name: Artifact-only signed build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check signing secrets
        run: |
          missing=0
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "MISSING SECRET: $s"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/alsaer-release-key.p12
          test -s android/app/alsaer-release-key.p12

      - name: Build web bundle (src -> www/index.html)
        run: python3 tools/build_web.py

      - name: Install Capacitor deps and sync
        run: |
          npm ci || npm install
          npx @capacitor/cli@5 sync android

      - name: Set version metadata (10145 + run number, name unchanged)
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode ' + str(10145 + int(os.environ['GITHUB_RUN_NUMBER'])), s, count=1)
          if n1 != 1:
              raise SystemExit('Could not set versionCode')
          p.write_text(s)
          print('versionCode set to', 10145 + int(os.environ['GITHUB_RUN_NUMBER']))
          PY

      - name: Assemble and sign release APK
        working-directory: android
        env:
          ALSAER_KEYSTORE_FILE: alsaer-release-key.p12
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature and fingerprint
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK"
          FP=$("$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "Cert SHA-256: $FP"
          EXPECTED_PREFIX="647b477f5e19a79ec542b70d"
          CLEAN=$(echo "$FP" | tr -d ':' | tr 'A-F' 'a-f')
          case "$CLEAN" in
            "$EXPECTED_PREFIX"*) echo "FINGERPRINT MATCH: certificate is the original release key" ;;
            *) echo "FINGERPRINT MISMATCH: expected prefix $EXPECTED_PREFIX"; exit 1 ;;
          esac
          "$BT/apksigner" verify --verbose "$APK" | head -20
          BADGING=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BADGING/aapt" dump badging "$APK" | grep -E 'package|versionCode|versionName' || true
          cp "$APK" Alsaer-sign-check.apk
          sha256sum Alsaer-sign-check.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsaer-sign-check
          path: Alsaer-sign-check.apk
          retention-days: 7

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/alsaer-release-key.p12
