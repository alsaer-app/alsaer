name: V4 mic test 10190 (temporary)
on:
  push:
    branches: [main]
    paths: [.github/workflows/v4-mic-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/quranlab-v4
          fetch-depth: 0
      - name: Apply reviewed mic patch on the test branch only
        shell: python
        run: |
          import base64,gzip,pathlib,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == '06db5fb0bf4594f36d10ebed4954c04e0eea6e1a', 'Test branch changed; refusing stale patch'
          pathlib.Path('/tmp/v4-mic.patch').write_bytes(gzip.decompress(base64.b64decode('')))
          subprocess.run(['git','apply','--check','/tmp/v4-mic.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/v4-mic.patch'],check=True)
          subprocess.run(['git','-c','user.name=alsaer-app','-c','user.email=alsaer-app@users.noreply.github.com','commit','-m','feat: V4 own raw capture with AGC, level and aligner diagnostics (test 10190)'],check=True)
          subprocess.run(['git','push','origin','HEAD:exp/quranlab-v4'],check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build web and sync native assets
        run: |
          python tools/build_web.py
          python tools/build_web.py --check
          node --check src/services/recite-asr.js
          npm ci
          npx @capacitor/cli@5 sync android
      - name: Decode signing key inside GitHub only
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/alsaer-release-key.p12
          test -s android/app/alsaer-release-key.p12
      - name: Build signed V4 personal test
        working-directory: android
        env:
          ALSAER_KEYSTORE_FILE: alsaer-release-key.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          QURANLAB_KEY: ${{ secrets.QURANLAB_KEY }}
        run: |
          test -n "$QURANLAB_KEY"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Offline mapping, alignment and AGC regressions
        run: |
          python tests/tf_reference_regression.py
          python tests/tf_alignment_regression.py
          python tests/tf_agc_regression.py
      - name: Verify signed APK and metadata
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/cert.txt
          grep -q '647b477f5e19a79ec542b70d12476a166f3bf262ae7b5c2b1602bcc58a1c85e0' /tmp/cert.txt
          "$BT/aapt" dump badging "$APK" | head -1 | tee /tmp/metadata.txt
          grep -q "versionCode='10190'" /tmp/metadata.txt
          grep -q "versionName='1.0.17-test13-v4mic'" /tmp/metadata.txt
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: alsaer-v4mic-10190-signed-test
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/alsaer-release-key.p12
